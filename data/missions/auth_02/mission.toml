# Authority 02: The Junction (M8-12, D-163). Hold a road junction on the Rust Belt for a relief column while the Directorate raids it.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "The Junction"
map = "rustbelt_m2.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 2
faction = "authority"
next = "auth_03"
locale = "locale.toml"

[starts_with]
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer"]

[unlocks_on_win]
tech = ["auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 4000
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer"]

[[players]]
slot = 1
name = "Directorate"
role = "ai"
team = 1
cash = 1500
faction = "directorate"

[[players]]
slot = 2
name = "Civilians"
role = "neutral"
team = 255
cash = 0

[zones.junction]
rect = [35, 13, 44, 23]

[zones.enemy_base]
