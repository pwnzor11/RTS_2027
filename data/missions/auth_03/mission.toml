# Authority 03: The Coast Road (M8-12, D-163). Escort two carriers across the Glass Coast dunes to the shore while the Directorate raids the yard behind.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# The map is ringed by sea, so every reinforcement uses a land zone (Reinforce.Zone), never an edge cell.

[mission]
title = "The Coast Road"
map = "glass_coast_e1.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 3
faction = "authority"
next = "auth_04"
locale = "locale.toml"

[starts_with]
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph"]

[unlocks_on_win]
tech = ["auth_signals_hq", "auth_howitzer", "auth_bulwark", "auth_gate", "auth_flak", "auth_airfield"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 6000
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph"]

[[players]]
slot = 1
name = "Directorate"
role = "ai"
team = 1
cash = 1500
faction = "directorate"

# The Left Behind cameo: script-driven only (role "neutral" keeps the AI off them), hostile to everyone.
[[players]]
slot = 2
name = "The Drift"
role = "neutral"
team = 2
cash = 0
faction = "left_behind"

