# Authority 03 "The Coast Road" locale. Speaker: Brigadier Wrenfield (leader_auth_wrenfield). Cameos: Chief Surveyor Fenn (leader_auth_fenn), war-captain Calloway-Ross (leader_lb_calloway_ross).
"a3.start" = "Two carriers, one road. Get Fenn's survey parties to the shore."
"a3.radio.start" = "Wrenfield. The coast is eighty cells away and there is nothing to hold on the way. Keep the carriers in the middle, Commander, and keep the yard standing behind you."
"a3.home1" = "Raiders on the yard! They came in from the east."
"a3.radio.home1" = "That is the yard. You cannot be in two places. Leave something home to meet them."
"a3.home2" = "A second column is making for the yard."
"a3.radio.home2" = "Second push on the yard. Mind your rear, Commander."
"a3.home3" = "The big column is on the yard. Sappers among them."
"a3.radio.home3" = "That is the third on the yard. They are not running out."
"a3.mid" = "Ambush on the road. Directorate raiders from the east!"
"a3.radio.mid" = "They knew we would cross here. Fight through. Do not let a carrier stop."
"a3.dunes" = "Riders in the dunes. They are not Directorate."
"a3.radio.drift" = "Authority carriers on the Drift road. The ledger is open. Take them."
"a3.coast" = "The garrison is coming out of the hatch field!"
"a3.radio.coast" = "Their garrison is counter-attacking. Hold the shore, Commander."
"a3.cache" = "Fenn's old survey cache. It still holds ration tins and fuel. Cash added."
"a3.radio.cache" = "Cache number six. I buried it in 1990. Take it, Commander, I do not need it."
"a3.shore" = "The carriers have reached the shore."
"a3.radio.shore" = "Surveyors are ashore. Clear the picket off the beach and the boats can come in."
"a3.picket.down" = "The Directorate picket is destroyed."
"a3.lost.carriers" = "Both carriers are lost. The survey parties will not reach the coast."
"a3.lost.yard" = "The yard is lost. There is nothing left behind to build from."
"a3.lost.tide" = "The tide has turned. The window to land is closed."
"a3.win" = "The coast is open. The survey parties are ashore."
"a3.radio.win" = "They are ashore. That was a long road. Well done, Commander."

# Objective and timer labels
"a3.obj.escort" = "Bring the carriers to the shore in the south"
"a3.obj.picket" = "Destroy the Directorate picket covering the landing"
"a3.obj.home" = "Keep the forward yard standing"
"a3.obj.cache" = "Find Chief Surveyor Fenn's old survey cache"
"a3.timer.tide" = "Landing window"

[voice]
"a3.radio.start" = "voice/leader_auth_wrenfield/a3.radio.start.ogg"
"a3.radio.mid" = "voice/leader_auth_wrenfield/a3.radio.mid.ogg"
"a3.radio.win" = "voice/leader_auth_wrenfield/a3.radio.win.ogg"
