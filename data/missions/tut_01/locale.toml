# Tutorial 01 text by key (D-030). Speaker id "instructor" is unnamed on purpose.
"intro" = "Welcome to Basic Training, Commander. I will walk you through the basics. Nothing here can hurt you, so take your time."
"step.move" = "Select your riflemen: left-click a soldier or drag a box around the squad. Then right-click the marked ground to the east to move them there."
"step.attack" = "Good. Now the enemy power plant to the east is your practice target. Select the squad and right-click the building to attack it."
"step.power" = "Every base runs on power. Open the Structure tab and build a Power Plant, then click a free spot beside your Construction Yard to place it."
"step.barracks" = "Power is up. Build a Barracks from the Structure tab and place it near the yard. The Barracks trains infantry."
"step.train" = "Select the Barracks tab and train a Rifleman. New soldiers join the squad at the Barracks."
"step.harvest" = "Soldiers cost money. Build a Refinery from the Structure tab. It comes with a free Scraper. Watch it drive to the pitchblende patch next to your base, fill up and bring the load home."
"step.fight" = "Last lesson. A small enemy camp sits in the north-east. Gather the squad and attack-move onto it. Destroy every soldier and the power plant there. Ignore the lone outpost in the far south-east; it is not part of the exercise."
"hint.move" = "Hint: left-click a soldier to select it, then right-click the marked ground to move."
"hint.attack" = "Hint: select soldiers, then right-click the enemy building to attack it."
"hint.power" = "Hint: Structure tab, Power Plant, then click a free cell beside the Construction Yard."
"hint.barracks" = "Hint: Structure tab, Barracks. Place it within reach of the Construction Yard."
"hint.train" = "Hint: select the Barracks and queue a Rifleman."
"hint.harvest" = "Hint: build a Refinery and give the Scraper time to fetch its first load."
"hint.fight" = "Hint: select every soldier and right-click the camp. Bring the new recruits too."
"done" = "Training complete. You are ready for the field, Commander."
"msg.done" = "Training complete."
