# Left Behind 02 "Road Posts" locale. Speaker: Jessup Calloway-Ross (leader_lb_calloway_ross); cameo: Brigadier Wrenfield (leader_auth_wrenfield) heard on the Authority net.
"lb2.start" = "The camp is down. Raise a Garage Rig and a Lookout, then take the road posts."
"lb2.radio.start" = "Commander, Calloway-Ross. Three posts on the roads. Build a garage and a lookout, train slingers, and cut them out one at a time."
"lb2.gate" = "Garage Rig and Lookout up. Slingers can be trained."
"lb2.radio.gate" = "Garage and lookout. Now the Muster Rig can teach slingers. Make a handful."
"lb2.radio.hint" = "Each turret runs off its own power plant, a good way back from the gun. Kill the plant and the turret goes dark."
"lb2.radio.power" = "Plant is burning. That turret will not fire. Now finish it."
"lb2.power.down" = "A post power plant is down."
"lb2.radio.seen" = "That is a post. One turret, a few rifles. They have a view of the whole road."
"lb2.post.down" = "A road post is down."
"lb2.radio.post1" = "First post silent. They know now."
"lb2.radio.post2" = "Second post gone. The road is open to the west."
"lb2.radio.post3" = "Last post gone. The belt is ours to cross."
"lb2.radio.intercept" = "Post to column. Post is lost. Send everything you have to the Drift camp."
"lb2.reprisal" = "The Authority reprisal column is on the north road."
"lb2.radio.reprisal" = "That is Wrenfield's voice on the net. His column is coming down the north road. Be home."
"lb2.reprisal.down" = "The reprisal column is broken."
"lb2.radio.beaten" = "Their column is a scrap heap. Finish the posts if any are left."
"lb2.radio.stash" = "A stash and two buggies nobody counted. Good eyes, Commander."
"lb2.stash" = "The Authority stash is ours: cash and two buggies."
"lb2.radio.win" = "Three posts, one column. Write it in the ledger. Small. We still have the Directorate to meet."
"lb2.win" = "The roads are open. The Drift crosses the Belt."
"lb2.lost.rig" = "The Mother Rig is lost. The caravan scatters."
"lb2.lost.time" = "The Authority garrison has fortified the posts. The road stays shut."
"lb2.radio.warn" = "Garrison trucks are on the rail line. Finish the posts now or lose the road."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"lb2.obj.gate" = "Raise a Garage Rig and a Lookout, then train slingers"
"lb2.obj.posts" = "Destroy the three Authority road posts"
"lb2.obj.hold" = "Break the Authority reprisal column"
"lb2.obj.stash" = "Find the Authority stash in the north corner"
"lb2.timer.reprisal" = "Reprisal column arrives"
"lb2.timer.garrison" = "Authority garrison fortifies the posts"

[voice]
"lb2.radio.start" = "voice/leader_lb_calloway_ross/lb2.radio.start.ogg"
"lb2.radio.win" = "voice/leader_lb_calloway_ross/lb2.radio.win.ogg"
