# Left Behind 01: The Refused (M8-10, D-163). Raid an Authority convoy on the Rust Belt road, seen from the other side of auth_01.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "The Refused"
map = "rustbelt_m2.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 1
faction = "left_behind"
next = "lb_02"
locale = "locale.toml"

[starts_with]
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_still_rig"]

[unlocks_on_win]
tech = ["lb_garage_rig"]

[[players]]
slot = 0
name = "The Drift"
role = "human"
team = 0
cash = 2000
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_still_rig"]

# The Authority convoy is driven by the script only (role "neutral" keeps the AI off the scrapers).
[[players]]
slot = 1
name = "Authority convoy"
role = "neutral"
team = 1
cash = 0

[[players]]
slot = 2
name = "Civilians"
role = "neutral"
team = 255
cash = 0

[zones.survey]
rect = [52, 3, 60, 10]

[zones.ambush]
rect = [28, 14, 40, 19]

[zones.camp]
rect = [26, 20, 36, 26]

[zones.cache]
rect = [3, 44, 8, 48]

# The convoy waits at the old rail depot in the north-west: two scrapers, a jeep, riflemen added by the script by tier.
[[actors]]
type = "auth_scraper"
player = 1
cell = [8, 8]
tag = "scraper1"

[[actors]]
type = "auth_scraper"
player = 1
cell = [6, 8]
tag = "scraper2"

# Anchor so the Authority team is not wiped out by the ambush alone (the script ends the mission).
[[actors]]
type = "auth_power"
player = 1
cell = [58, 58]
tag = "anchor"
