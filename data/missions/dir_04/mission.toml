# Directorate 04: The Sunrise (M8-12 D4). Order Seven (D-086 canon): fire the Sunrise Device under the Authority's Ash Ridge command.
# Defend the Device and the tunnel head until it is charged, then fire it. Zones are inclusive cell rectangles [x0, y0, x1, y1].
# Pre-placed actors are placed before tick 0 (setup log). The Device (3000 ticks to charge) starts charging at tick 0.

[mission]
title = "The Sunrise"
map = "ash_reckoning.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2030
schema = 2
act = 4
faction = "directorate"
