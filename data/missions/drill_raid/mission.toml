# Drill: Raid (S47 U-12). One skill: wreck a small enemy depot with a small squad before the alarm. Medal by time and units kept.
# Map: test_32. Your squad starts in the north, west of the depot; the depot (two power plants, a silo, a turret, two riflemen) is in the north-east.

[mission]
schema = 2
title = "Drill: Raid"
map = "test_32.map.toml"
script = "mission.lua"
briefing = "briefing.md"
locale = "locale.toml"
seed = 2027
act = 1
faction = "authority"

# Medal limits (data, not code). Time in seconds (lower is better); keep_* is how many of your 6 units must survive.
# Assumed values, confirm after a playtest.
[drill]
order = 3
metric = "seconds"
gold = 95
silver = 130
bronze = 190
keep_gold = 5
keep_silver = 4
keep_bronze = 3

