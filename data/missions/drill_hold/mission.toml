# Drill: Hold the line (S47 U-12). One skill: hold a chokepoint with a fixed force against three scripted waves. Medal by units and structures lost.
# Map: test_32. The walled yard in the middle has a gate on its east side (cells 23, 17-19). Your force stands just inside it.

[mission]
schema = 2
title = "Drill: Hold the line"
map = "test_32.map.toml"
script = "mission.lua"
briefing = "briefing.md"
locale = "locale.toml"
seed = 2027
act = 1
faction = "authority"

# Medal limits (data, not code). Own units plus structures lost, lower is better. Assumed values, confirm after a playtest.
[drill]
order = 2
metric = "lost"
gold = 4
silver = 6
bronze = 9

# Q-94 / D-341 Q5 (b): upgrade ids are gated like units. Every upgrade of the faction stays listed here (and in the human tech) so no mission loses one;
# the "(Q5 b)" reward upgrades (design 22) are NOT removed yet, the new reward missions will move them later.
[starts_with]
tech = ["auth_turret", "auth_rifleman", "auth_grouting", "auth_up_composite_armour", "auth_up_convoy_drill", "auth_up_flak_vests", "auth_up_signals_net", "auth_up_sodium_lamps", "auth_up_tungsten_shot"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 2400
tech = ["auth_turret", "auth_rifleman", "auth_grouting", "auth_up_composite_armour", "auth_up_convoy_drill", "auth_up_flak_vests", "auth_up_signals_net", "auth_up_sodium_lamps", "auth_up_tungsten_shot"]

[[players]]
