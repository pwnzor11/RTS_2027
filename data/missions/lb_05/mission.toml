# Left Behind 05: Under One Banner (S48 C-12, design 22 section 3.3). Play position 2 of the Left Behind campaign (act 1), Rust Belt, west part.
# Build-and-destroy in two phases: the Two Fires and Long Haul hold on the north-west road, then Nobody's Daughter's well.
# Zones are inclusive cell rectangles [x0, y0, x1, y1] (all `(tune)`). Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "Under One Banner"
map = "rustbelt_m2.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 1
# D-289: bot tier-3 median win x 2.5. Placeholder until the 12-seed sweep has measured it.
par_seconds = 900  # PENDING par from sweep
faction = "left_behind"
# lb_06 (Salvage Rights) joins later between lb_05 and lb_02; until it exists the campaign list (data/campaigns/left_behind.toml) sets the order.
next = "lb_06"
locale = "locale.toml"

# A subset of what lb_01 ends with: its kit, without the Garage Rig (the vehicles it builds are this mission's reward).
# Q-94 / D-341 Q5 (b): upgrade ids are gated like units. Every upgrade of the faction stays listed here (and in the human tech) so no mission loses one;
# the "(Q5 b)" reward upgrades (design 22) are NOT removed yet, the new reward missions will move them later.
[starts_with]
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_still_rig", "lb_up_ash_wraps", "lb_up_grapple", "lb_up_patchwork", "lb_up_quick_pack", "lb_up_salvage_rights", "lb_up_scrap_plate"]

[unlocks_on_win]
tech = ["lb_buggy", "lb_gleaner"]

[[players]]
slot = 0
name = "The Drift"
role = "human"
team = 0
cash = 2200
# Only these may be built (production chain prerequisites still apply). Slingers come with the column; there is no Lookout to train more.
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_spike_nest", "lb_still_rig", "lb_up_ash_wraps", "lb_up_grapple", "lb_up_patchwork", "lb_up_quick_pack", "lb_up_salvage_rights", "lb_up_scrap_plate"]

# Nobody's Daughter: the well. Played by the built-in AI (tier follows the mission tier); the script adds guards and the counter-attack.
[[players]]
slot = 1
name = "Nobody's Daughter"
role = "ai"
team = 1
cash = 800
faction = "left_behind"

# Two Fires and Long Haul: the hold on the road. Driven by the script only (role "neutral" keeps the AI off it). Same team as the well.
[[players]]
slot = 2
name = "Two Fires and Long Haul"
role = "neutral"
team = 1
cash = 0

[zones.home]
rect = [2, 2, 14, 12]

[zones.outpost]
rect = [13, 20, 24, 26]

[zones.well]
rect = [6, 39, 16, 47]

# The camp: the Mother Rig is already down, with power, a yard and a Muster Rig.
[[actors]]
type = "lb_mother_rig"
player = 0
cell = [6, 4]
tag = "rig"

[[actors]]
type = "lb_dynamo_rig"
player = 0
cell = [10, 4]

[[actors]]
type = "lb_yard"
player = 0
cell = [6, 8]

[[actors]]
type = "lb_muster_rig"
player = 0
cell = [10, 7]

# The hold on the road (Two Fires and Long Haul): a Dynamo Rig, a Muster Rig and two spike nests. The script adds the garrison by tier.
[[actors]]
type = "lb_dynamo_rig"
player = 2
cell = [15, 22]
tag = "out_dyn"

[[actors]]
type = "lb_muster_rig"
player = 2
cell = [19, 22]
tag = "out_must"

[[actors]]
type = "lb_spike_nest"
player = 2
cell = [17, 25]

[[actors]]
type = "lb_spike_nest"
player = 2
cell = [21, 25]

# The well (Nobody's Daughter): the Mother Rig (the hidden bonus: take it whole), a Dynamo Rig and a Muster Rig, and two spike nests.
[[actors]]
type = "lb_mother_rig"
player = 1
cell = [8, 41]
tag = "well_rig"

[[actors]]
type = "lb_dynamo_rig"
player = 1
cell = [12, 41]
tag = "well_dyn"

[[actors]]
type = "lb_muster_rig"
player = 1
cell = [12, 44]
tag = "well_must"

[[actors]]
type = "lb_spike_nest"
player = 1
cell = [11, 39]

[[actors]]
type = "lb_spike_nest"
player = 1
cell = [15, 44]
