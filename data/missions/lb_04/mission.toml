# Left Behind 04: The Banner (M8-12, D-163). Act 4, Reckoning, Ash Plains: drive the Expedition off the coast (finale; the warlord takes over).
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# Map: ash_reckoning (96x96, mirror_y). Sea at the north and south edges; the Drift camp is in the north, the Expedition beachhead on the south shore.

[mission]
title = "The Banner"
map = "ash_reckoning.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 4
faction = "left_behind"
locale = "locale.toml"

# lb_03 kit + what lb_03 unlocked (rotor pad, rolling fort, veilwalker, organ, harpoon post) + the finale's gifts: rotors, kites, flak and the Second Drift.
[starts_with]
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_garage_rig", "lb_buggy", "lb_gleaner", "lb_lookout", "lb_bench", "lb_harpoon_wagon", "lb_tinker", "lb_drifter_brute", "lb_rotor_pad", "lb_rolling_fort", "lb_veilwalker", "lb_organ", "lb_harpoon_post", "lb_rotor", "lb_kite", "lb_flak_net", "lb_second_drift"]

[[players]]
