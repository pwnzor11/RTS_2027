# Left Behind 04 "The Banner" locale. Speaker: Jessup Calloway-Ross (leader_lb_calloway_ross), now warlord; cameo: Air Marshal Perpetua Kell (leader_exp_kell) on the Expedition net.
"lb4.start" = "The Expedition holds the south shore. Their batteries cover the north face."
"lb4.radio.start" = "Commander, Calloway-Ross. The Speaker gave me the banner for the winter. Take the beachhead from the east. Do not walk up the north face."
"lb4.radio.hint" = "Two batteries, eight cells of range. They run off two pile houses at the east end. Dark the houses and the guns are scrap."
"lb4.landing" = "The Expedition has landed a counter-force on the plains."
"lb4.radio.kell" = "Landing force, down. Keep your heads up and count each other. Nobody is left on that sand."
"lb4.radio.landing" = "Marines on the plains, coming for the camp. Hold the camp. The beach will keep."
"lb4.counter.down" = "The counter-landing is broken."
"lb4.radio.counter" = "Their landing is bleeding out on the plains. Now take the east flank."
"lb4.pile.down" = "A pile house is down."
"lb4.dark" = "Both pile houses are down. The gun batteries are dark."
"lb4.radio.dark" = "Houses are dark. The guns are walls. Go in and break the depot."
"lb4.battery.down" = "A gun battery is down."
"lb4.depot.down" = "The Landing Depot is destroyed. The beachhead is broken."
"lb4.radio.kellout" = "Depot lost. All hands to the ships. Count twice. The coast is not worth the names."
"lb4.radio.fleet" = "Second wave in sight of the coast. Hold the sand, however you can."
"lb4.radio.warn" = "Their second wave is on the water. Break that depot or we lose the coast."
"lb4.wreck" = "The wreck of the supply lander: crates and two tinkers."
"lb4.radio.wreck" = "Crates from their lander, and two tinkers who knew how to open them. Good eyes, Commander."
"lb4.win" = "The Expedition is driven off the coast. The banner flies over the Drift."
"lb4.radio.win" = "That is the last of them. The Authority asked us nothing and the Directorate told us everything. Now we will say what happens next. Write it large."
"lb4.lost.rig" = "The Mother Rig is lost. The banner falls."
"lb4.lost.fleet" = "The Expedition's second wave has landed on an unbroken beachhead. The coast is theirs."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"lb4.obj.counter" = "Break the Expedition's counter-landing at the camp"
"lb4.obj.power" = "Destroy both pile houses at the east end of the beachhead"
"lb4.obj.depot" = "Destroy the Landing Depot"
"lb4.obj.wreck" = "Reach the wreck of the supply lander on the east plains"
"lb4.timer.landing" = "Expedition counter-landing"
"lb4.timer.fleet" = "Expedition second wave arrives"

[voice]
"lb4.radio.start" = "voice/leader_lb_calloway_ross/lb4.radio.start.ogg"
