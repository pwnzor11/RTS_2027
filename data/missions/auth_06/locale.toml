# Authority 06 "The Mill Town" locale. Speakers: Brigadier Wrenfield (leader_auth_wrenfield), Administrator Pell by teletype (leader_auth_pell).
# Voice lines are text only for now: there is no [voice] table, so no audio is looked up and a missing file can never error.
"a6.start" = "Break the Directorate shift under the mill town before the grain train turns back."
"a6.radio.pell" = "Teletype, Administrator Pell. The winter grain cannot cross the county without that rail line. Please open it, and please leave the elevator standing."
"a6.radio.start" = "Wrenfield. Raise a factory, put scrapers on the spur and get tanks on the road, Commander. Then we take the town one hatch at a time."
"a6.tank" = "The first tank is rolling."
"a6.radio.tank" = "First tank. They are slow and they are heavy and a hatch does not argue with one. Keep them together."
"a6.hall" = "A ration hall is standing."
"a6.radio.hall" = "Ration hall up. Now the road can feed more than a squad. Count the rations before you count the tanks."
"a6.spur" = "Two scrapers are working the pitchblende spur."
"a6.radio.spur" = "Teletype, Pell. The spur is paying. Thank you. Please do not let the Directorate have it back."
"a6.raid1" = "Directorate raiders out of the west!"
"a6.radio.raid1" = "Raiders on the west road, heading for the yard. Pull something back to meet them."
"a6.raid2" = "A second column from the south, and the shift is moving."
"a6.radio.raid2" = "South road, and the town's garrison is coming out with them. They want your yard. Hold it."
"a6.hatch" = "A hatch is down."
"a6.vent" = "A reactor vent is down."
"a6.radio.half" = "Half their hatches are gone. They will not like that. Watch the north road."
"a6.sortie" = "The shift is sending a column down from the north road."
"a6.radio.sortie" = "Column from the north, into the town. They are counter-attacking the way a man bails a boat. Hold what you have taken."
"a6.elevator" = "The old grain elevator is in sight, on the north-east side of the town."
"a6.radio.elevator" = "Teletype, Pell. That is the elevator. It held the whole county's grain once. Please aim around it."
"a6.elevator.lost" = "The grain elevator is gone."
"a6.radio.grain" = "Teletype, Pell. The elevator is standing and the rail is open. I will not call it a victory. I will call it grain."
"a6.win" = "The shift is broken. The mill town is open."
"a6.radio.win" = "That is the town. The shift is out of the ground and the rail line is ours. The grain moves tonight."
"a6.lost.yard" = "The yard is lost. The base cannot go on."
"a6.lost.train" = "The grain train has turned back. The town is still closed."

# Objective and timer labels
"a6.obj.hatches" = "Destroy the four hatches under the mill town"
"a6.obj.vents" = "Destroy the two reactor vents"
"a6.obj.yard" = "Keep the construction yard standing"
"a6.obj.spur" = "Put two scrapers on the pitchblende spur"
"a6.obj.elevator" = "Leave the old grain elevator standing"
"a6.timer.train" = "Grain train"
