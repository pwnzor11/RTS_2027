# Authority 06: The Mill Town (S48, C-12 wave 1; design 22 section 3.1). Play position 3 of the Authority campaign, act 1, build-and-destroy.
# A Directorate forward shift has dug in under the ruined mill town on rustbelt_mill. Raise a base in the south-west corner, put scrapers on the
# pitchblende spur, break the shift's four hatches and two reactor vents; hidden bonus: leave the old grain elevator standing.
# Zones are inclusive cell rectangles [x0, y0, x1, y1], copied from the map's header comment (data/maps/rustbelt_mill.map.toml).
# Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "The Mill Town"
map = "rustbelt_mill.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 1
# D-289: bot tier-3 median win x 2.5. Placeholder until the 12-seed sweep has measured it.
par_seconds = 600  # PENDING par from sweep
faction = "authority"
next = "auth_02"
locale = "locale.toml"

# Q-94 / D-341 Q5 (b): upgrade ids are gated like units. Every upgrade of the faction stays listed here (and in the human tech) so no mission loses one;
# the "(Q5 b)" reward upgrades (design 22) are NOT removed yet, the new reward missions will move them later.
[starts_with]
# What auth_01 ends with (its starts_with plus auth_turret) plus auth_05's unlocks (auth_engineer, auth_rocketeer).
# S48: auth_05 lands from wp/s48-auth05; the lead fixes this at merge.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_engineer", "auth_rocketeer", "auth_grouting", "auth_up_composite_armour", "auth_up_convoy_drill", "auth_up_flak_vests", "auth_up_signals_net", "auth_up_sodium_lamps", "auth_up_tungsten_shot"]

[unlocks_on_win]
# Design 22 section 3.1: the first full base. auth_02 starts with exactly these.
tech = ["auth_tank", "auth_scraper", "auth_silo", "auth_ration_hall", "auth_seismograph"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 4000
# Only these may be built (production chain prerequisites still apply). The kit is usable in this mission; the win makes it permanent.
