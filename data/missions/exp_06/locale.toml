# Expedition 06 "Dredge Rights" locale. Speakers: Commissioner Imelda Strand (leader_exp_strand), Dr. Anselm Roque (leader_exp_roque), Authority net (leader_auth_wrenfield).
# Voice lines are text only for now: there is no [voice] table, so no audio is looked up and a missing file can never error.
"e6.start" = "The Command Ship is in the shallows. Deploy it on the beach."
"e6.radio.start" = "Commander, this is Commissioner Strand. We would be grateful if you would put the flagship ashore on the south beach. The fleet must pay for itself."
"e6.landed" = "Landing Depot established. The first shipment is coming in."
"e6.radio.landed" = "The depot is down, Commander. Please raise a Dredge Works and put two Skimmers on the ash."
"e6.ship2" = "Second shipment landing on the beach."
"e6.radio.ship2" = "The second shipment has arrived. Use it well, Commander."
"e6.shells" = "Authority guns are ranging the sandbar."
"e6.radio.shells" = "That is the coast battery, Commander. It is ranging the sandbar. It will find the shallows soon."
"e6.works" = "The Dredge Works stands. The Hover Yard is authorised and two prototype Glide Tanks are sailing in."
"e6.radio.works" = "The dredge stands. Good. A second Skimmer will have to come out of a Hover Yard, Commander. I have asked Dr. Roque."
"e6.dredge" = "Two Skimmers are on the ash. The dredge pays its way. Two more prototypes are sailing in."
"e6.radio.dredge" = "Two Skimmers on the ash. The fleet has begun to pay for itself, Commander."
"e6.radio.roque" = "Roque here. I am sending the Hover Yard drawings, and two prototype Glide Tanks by their own cushions. Please be kind to them. They have not been tested on anything that shoots back."
"e6.wave1" = "Authority column on the north road!"
"e6.radio.wrenfield" = "Authority net, overheard: the landing is on the south beach. Hold the battery and drive them back into the water."
"e6.wave2" = "Second Authority column on the north road!"
"e6.radio.wave2" = "More from the north, Commander. They are not giving up the coast."
"e6.battery" = "The coast battery is broken. The shallows are safe."
"e6.radio.battery" = "The battery is silent. The shallows are ours, Commander. The fleet has a harbour."
"e6.wreck" = "A hover has reached the relief ship's hull. Dr. Roque has his drawings."
"e6.radio.wreck" = "Roque here. She was one of ours, Commander. I will see that her plates go home with the Hydrographic Office."
"e6.win" = "The dredge rights are ours."
"e6.radio.win" = "The south coast pays its way, Commander. I will see that the Office of Return hears of it."
"e6.lost.ship" = "The Command Ship is lost. The landing has failed."
"e6.lost.depot" = "The Landing Depot has fallen. The beachhead is lost."

# Objective and timer labels
"e6.obj.landing" = "Deploy the Command Ship on the beach"
"e6.obj.dredge" = "Raise a Dredge Works and put two Skimmers on the ash"
"e6.obj.battery" = "Break the Authority coast battery"
"e6.obj.wreck" = "Reach the relief ship's wreck for Dr. Roque"
"e6.timer.ship2" = "Second shipment"
"e6.timer.col1" = "Authority column"
