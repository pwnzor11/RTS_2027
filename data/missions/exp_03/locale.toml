# Expedition 03 "The Fleet Reaches the Coast" locale. Speaker: Commissioner Imelda Strand (leader_exp_strand); cameos Fleet Admiral Corvin Aldersey, Air Marshal Perpetua Kell and the Directorate's announcer (leader_dir_larkin).
"e3.start" = "An advance party holds the cove. Raise a Flight Deck and a SAM Mount before the carrier group arrives."
"e3.radio.start" = "Commander, this is Commissioner Strand. The fleet is off the west coast. We would be grateful if you would raise a Flight Deck and a SAM Mount in the cove, and then hold it."
"e3.deck" = "The Flight Deck and the SAM Mount stand."
"e3.radio.kell" = "Kell here. Deck and mount are up. Remember the aircraft carry five rounds each, then they come home to rearm."
"e3.fleet" = "The carrier group is sailing into the cove."
"e3.radio.aldersey" = "Admiral Aldersey to the landing force. The carrier group is coming in under your guns, Commander. Please keep the water clear."
"e3.carrier" = "The carrier is anchored in the cove."
"e3.radio.carrier" = "The carrier is in the cove, Commander. The Admiral sends his thanks."
"e3.destroyer.lost" = "A destroyer is lost."
"e3.radio.destroyer" = "We have lost a destroyer. Please keep the rest in the cove."
"e3.auth1" = "Authority column on the north road!"
"e3.radio.auth1" = "The Authority is coming down the north road. Hold the cove, Commander."
"e3.dir1" = "Directorate column out of the south dunes!"
"e3.radio.larkin" = "Directorate broadcast, overheard: the surface belongs to those who dig under it. Citizens, welcome the visitors."
"e3.raid" = "Authority bombers over the west sea!"
"e3.radio.raid" = "Kell here. Bombers from the west. Mounts and jets, please."
"e3.auth2" = "A second Authority column on the north road!"
"e3.dir2" = "A second Directorate column from the dunes!"
"e3.radio.last" = "That is both of them at once, I think. Hold the line."
"e3.held" = "Both fronts are beaten."
"e3.lost.depot" = "The Landing Depot has fallen. The cove is lost."
"e3.lost.carrier" = "The carrier is lost. The fleet has failed."
"e3.win" = "The cove holds. The fleet is on the coast."
"e3.radio.win" = "The fleet has reached the coast, Commander. I will say so in the telex, in my own words."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"e3.obj.deck" = "Raise a Flight Deck and a SAM Mount in the cove"
"e3.obj.carrier" = "Bring the carrier into the cove"
"e3.obj.hold" = "Hold the cove against both columns and the air raid"
"e3.obj.fleet" = "Lose no destroyer"
"e3.timer.fleet" = "Carrier group arrives"

[voice]
"e3.radio.start" = "voice/leader_exp_strand/e3.radio.start.ogg"
"e3.radio.carrier" = "voice/leader_exp_strand/e3.radio.carrier.ogg"
"e3.radio.win" = "voice/leader_exp_strand/e3.radio.win.ogg"
