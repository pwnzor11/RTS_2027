# Expedition 05 "The South Coast" locale. Speakers: Commissioner Imelda Strand (leader_exp_strand), Fleet Admiral Aldersey (leader_exp_aldersey).
# Voice lines are text only for now: there is no [voice] table, so no audio is looked up and a missing file can never error.
"e5.start" = "Find the wreck on the sandbar, clear it, and take its signal log out to sea."
"e5.radio.start" = "Commander, this is Commissioner Strand. We would be grateful if you would look at the hull on the sandbar. The scavengers have been there first, I am told."
"e5.found" = "This is the relief ship. Scavengers are stripping her."
"e5.radio.found" = "That is her, Commander. The paint still says relief. Please clear the sandbar, and keep the hover out of the shooting."
"e5.radio.aldersey" = "Aldersey. If there is a log, I will have it sealed and unread. That is a request, Commander, and I would be obliged."
"e5.band" = "Scavenger band out of the railhead!"
"e5.radio.band" = "Movement at the railhead, Commander. Someone has heard the shooting."
"e5.band2" = "A second band is coming down the east dunes!"
"e5.radio.band2" = "Another party in the east dunes, Commander. They are not all scavengers by temperament."
"e5.cleared" = "The wreck is clear. Bring the Survey Hover in for the log."
"e5.radio.cleared" = "The sandbar is yours. Send the hover in for the log, and then run for open water."
"e5.logged" = "The signal log is aboard. Run for open sea."
"e5.radio.logged" = "The log is aboard. They will come for it, Commander. The launch is waiting in the deep water to the south."
"e5.board" = "The platform board is written in chalk and marker. Someone counted the days."
"e5.radio.board" = "Thank you, Commander. The Hydrographic Office will want that copied. It is a long list."
"e5.win" = "The log is out to sea, sealed."
"e5.radio.win" = "The launch has it. The admiral will have it by morning, sealed. Well done, Commander."
"e5.lost.survey" = "The Survey Hover is lost. The log cannot be carried out."
"e5.lost.tide" = "The tide has turned. The launch has gone."
"e5.lost.party" = "The party is lost. Nobody is left to carry the log."

# Objective and timer labels
"e5.obj.wreck" = "Find the wreck of the relief ship"
"e5.obj.log" = "Clear the wreck and take the signal log aboard the Survey Hover"
"e5.obj.out" = "Run the log out to open sea"
"e5.obj.board" = "Read the evacuation board on the platform"
"e5.timer.tide" = "The launch waits"
