# Expedition 04: The Fuel (M8-12, act 4, the finale). The fleet lands on the south shore of the Ash Plains: put a Dredge Works on the ash field, hold the beachhead against the Directorate's response and break the redoubt with its Shaft and its Sunrise Device.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# Map: ash_reckoning (the act 4 map, D-030). Sea along the south edge (shallows y 88-91, open water from y 92); the Directorate redoubt sits at the north start (47,13).

[mission]
title = "The Fuel"
map = "ash_reckoning.map.toml"
