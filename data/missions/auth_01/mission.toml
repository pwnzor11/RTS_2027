# Authority 01: Survey Convoy (M2-15 pilot, D-061). Escort, survive two raids, plant a refinery on the pit.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).

[mission]
