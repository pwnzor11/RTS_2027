# Authority 07: The Defector (S47 pilot of the campaign expansion, D-333/D-337; design 22 section 6). Play position 5 of the Authority campaign.
# No base: bring a sealed carrier column to the Shaft Four spoil heaps, pick up Lieutenant Dray, and get him home alive.
# Zones are inclusive cell rectangles [x0, y0, x1, y1] (all `(tune)`). Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "The Defector"
map = "rustbelt_m2.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 2
# D-289: bot tier-3 median win x 2.5. Placeholder until the 12-seed sweep has measured it.
par_seconds = 600  # PENDING par from sweep
faction = "authority"
next = "auth_08"
locale = "locale.toml"

[starts_with]
# auth_02's starts_with plus its unlocks (the act-2 kit). Nothing is buildable without a yard; this only keeps the allow-list honest.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier"]

[unlocks_on_win]
# D-337 Q4: Dray's log gives the tunnel bearings.
tech = ["auth_seismic_mortar"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 0
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier"]

[[players]]
