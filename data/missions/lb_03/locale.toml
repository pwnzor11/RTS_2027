# Left Behind 03 "Hatch Field" locale. Speaker: Jessup Calloway-Ross (leader_lb_calloway_ross); cameo: Commissar Ignatius Thrall (leader_dir_thrall) heard on the Directorate net.
"lb3.start" = "The camp is up on the Glass Coast. The hatch field is in the middle of the dunes."
"lb3.radio.start" = "Commander, Calloway-Ross. Hatch field in the middle, an Authority column on the way. Two wars. Pick your order."
"lb3.radio.hint" = "Pillboxes reach three cells and run off the vent. Harpoon wagons reach five. Kill the vent from where the pillboxes cannot answer."
"lb3.radio.seen" = "There is the field. Three hatches, a vent, pillboxes on the far side. They watch the west."
"lb3.wave" = "Soldiers are coming out of the hatches."
"lb3.radio.wave" = "Hatches are pouring. Keep the camp guard at home."
"lb3.radio.thrall" = "Hatch field, report. Surface vermin on the dunes. Note the faces. Register what is left of them."
"lb3.vent.down" = "The reactor vent is down. The pillboxes are dark."
"lb3.radio.vent" = "Vent is burning. The pillboxes are walls now. Go in and close the hatches."
"lb3.hatch.down" = "A hatch is closed."
"lb3.radio.hatches" = "Last hatch gone. The hole is a hole again."
"lb3.radio.thrallout" = "The field is silent. The notebook is full. Annex, brace."
"lb3.column" = "The Authority column is coming down from the north."
"lb3.radio.column" = "That is the Authority, from the north, with a tank. Hands to the camp."
"lb3.column.down" = "The Authority column is broken."
"lb3.radio.columndown" = "Column is scrap. Wrenfield will count his dead and not ours."
"lb3.mast" = "The loudspeaker mast is down."
"lb3.radio.mast" = "The Voice is off the air on the coast. Cash from the mast crew's chest, Commander."
"lb3.win" = "The hatch field is closed and the camp holds. The Glass Coast is ours to look at."
"lb3.radio.win" = "Two wars and the camp still stands. Write it small. The ships are next."
"lb3.lost.rig" = "The Mother Rig is lost. The caravan is scattered on the coast."
"lb3.lost.overrun" = "The hatches have emptied the field onto the dunes. The camp is overrun."
"lb3.radio.warn" = "The hatches keep pouring. Every wave is bigger. Close them or lose the camp."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"lb3.obj.vent" = "Destroy the hatch field's reactor vent"
"lb3.obj.hatches" = "Close all three hatches"
"lb3.obj.column" = "Break the Authority column at the camp"
"lb3.obj.mast" = "Pull down the Directorate loudspeaker mast"
"lb3.timer.column" = "Authority column reaches the camp"

[voice]
"lb3.radio.start" = "voice/leader_lb_calloway_ross/lb3.radio.start.ogg"
"lb3.radio.win" = "voice/leader_lb_calloway_ross/lb3.radio.win.ogg"
