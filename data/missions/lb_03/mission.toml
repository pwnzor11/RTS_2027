# Left Behind 03: Hatch Field (M8-12, D-163). Act 3, Glass Coast: break into a Directorate hatch field while an Authority column hits the camp (two fronts).
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# Map: glass_coast_e1 (96x96, sea on every edge, open dunes between x 10 and 85). Camp in the north-west, the hatch field in the middle.

[mission]
title = "Hatch Field"
map = "glass_coast_e1.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 3
faction = "left_behind"
next = "lb_04"
locale = "locale.toml"

# lb_02 kit + what lb_02 unlocked (Tinker's Bench, harpoon wagons, tinkers, brutes).
[starts_with]
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_garage_rig", "lb_buggy", "lb_gleaner", "lb_lookout", "lb_bench", "lb_harpoon_wagon", "lb_tinker", "lb_drifter_brute"]

# The tier-3 gate and its first fruits, for act 4.
[unlocks_on_win]
tech = ["lb_rotor_pad", "lb_rolling_fort", "lb_veilwalker", "lb_organ", "lb_harpoon_post"]

[[players]]
slot = 0
name = "The Drift"
role = "human"
team = 0
cash = 2500
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_garage_rig", "lb_buggy", "lb_gleaner", "lb_lookout", "lb_bench", "lb_harpoon_wagon", "lb_tinker", "lb_drifter_brute"]

# The Authority column is driven by the script only (role "neutral" keeps the AI off it). Team 1.
[[players]]
slot = 1
name = "Authority column"
role = "neutral"
team = 1
cash = 0

# The Directorate hatch field: its structures and waves are driven by the script (hatches pour out soldiers). Team 2.
[[players]]
slot = 2
name = "Directorate hatch field"
role = "neutral"
team = 2
cash = 0

[[players]]
