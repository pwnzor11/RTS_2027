# Directorate 06 "The Assembly Bore" locale. Speakers: the Voice (leader_dir_larkin), Dr. Perpetua Lund (leader_dir_lund).
# Voice lines are text only for now: there is no [voice] table, so no audio is looked up and a missing file can never error.
"d6.start" = "Raise the smelter vent on the scrap field, then the assembly bore, and clear the Authority survey camp."
"d6.radio.start" = "Commander, this is the Voice. Good evening, Shaft Four. The mill town is above you and the tenancy has not yet looked down. Raise the smelter vent first. The rest follows from it."
"d6.radio.lund" = "Lund, Isotope Works. Keep the reactors warm, Commander. I will not waste your time with slogans. Build me a bore, and build it deep and straight."
"d6.smelter" = "The smelter vent stands. The drawings are coming down."
"d6.radio.smelter" = "Lund. The vent is true. You may have the cistern, the bunk gallery and the assembly bore. Mind the bore: I would like to know how far a shaft goes up as well as down."
"d6.radio.stakes" = "The tenancy has driven a survey stake at the pitch spur, west of you. Not required. Pull it if the shift has a spare hand."
"d6.bore" = "The assembly bore is running. Rocket trucks are on the line."
"d6.radio.bore" = "Lund. It turns. Rocket trucks off the bore, Commander: a cheap way to be rude at a distance. Look after the crews."
"d6.camp" = "The survey camp is silent."
"d6.radio.camp" = "The rig is down and nobody is left to call it in. The mill town is ours until the rain."
"d6.stakes" = "The survey stake at the pitch spur is pulled."
"d6.patrol" = "A tenancy patrol is coming down the north road."
"d6.radio.patrol" = "A patrol on the north road, Commander. They are looking for a door. Do not show them one."
"d6.rail" = "A rail gang is coming along the old bed from the west."
"d6.radio.rail" = "A rail gang from the west. They walk the sleepers, Commander. Meet them on the sleepers."
"d6.column" = "The survey column is on the east rail!"
"d6.radio.column" = "The survey column is in. Rifles and rockets behind the camp. If the camp still stands, it will answer."
"d6.win" = "The bore turns and the camp is cold. The shift is a good shift."
"d6.radio.win" = "Well done, Commander. The Director is pleased. Dr. Lund is pleased, which is rarer. It is dry in the town tonight. Sleep when you can."
"d6.lost" = "The shaft is lost. The shift is cut off."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"d6.obj.smelter" = "Raise a smelter vent on the scrap field"
"d6.obj.bore" = "Raise the cistern, the bunk gallery and the assembly bore"
"d6.obj.camp" = "Clear the Authority survey camp east of the mill"
"d6.obj.stakes" = "Pull the Authority survey stake at the pitch spur"
"d6.timer.survey" = "Survey column"
