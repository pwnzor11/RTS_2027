# Directorate 06: The Assembly Bore (S48 C-12, design 22 section 3.2). Play position 3 of the Directorate campaign (act 1).
# Build and destroy: raise the smelter vent, cistern, bunk gallery and assembly bore on the scrap field under the mill town, and clear the Authority survey camp.
# Zones are inclusive cell rectangles [x0, y0, x1, y1], copied from the header of data/maps/rustbelt_mill.map.toml. Pre-placed actors are placed before tick 0 (setup log).

[mission]
title = "The Assembly Bore"
map = "rustbelt_mill.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2029
schema = 2
act = 1
par_seconds = 1680   # S48 sweep sw48b (D-289): tier-3 median win 13361 ticks x 2.5, rounded up to a minute
faction = "directorate"
next = "dir_02"
locale = "locale.toml"

# Q-94 / D-341 Q5 (b): upgrade ids are gated like units. Every upgrade of the faction stays listed here (and in the human tech) so no mission loses one;
# the "(Q5 b)" reward upgrades (design 22) are NOT removed yet, the new reward missions will move them later.
[starts_with]
# What dir_01 ends with (its starts_with plus dir_sapper) plus dir_05's unlocks (dir_smelter_vent, dir_scraper). The cistern, bunk gallery, assembly bore
# and rocket truck are this mission's rewards: the script grants them as the shift earns them (Tech.Grant).
tech = ["dir_reactor_vent", "dir_muster_hatch", "dir_hatch", "dir_pillbox", "dir_conscript", "dir_ashthrower", "dir_bore_head", "dir_sapper", "dir_smelter_vent", "dir_scraper", "dir_up_blackout_canisters", "dir_up_fervour", "dir_up_hot_cores", "dir_up_lead_lining", "dir_up_mass_conscription", "dir_up_order_seven", "dir_up_tunnel_bracing"]

[unlocks_on_win]
tech = ["dir_assembly_bore", "dir_rocket_truck", "dir_cistern", "dir_bunk_gallery"]

[[players]]
slot = 0
name = "Directorate"
role = "human"
team = 0
cash = 7500
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["dir_reactor_vent", "dir_muster_hatch", "dir_hatch", "dir_pillbox", "dir_conscript", "dir_ashthrower", "dir_bore_head", "dir_sapper", "dir_smelter_vent", "dir_scraper", "dir_up_blackout_canisters", "dir_up_fervour", "dir_up_hot_cores", "dir_up_lead_lining", "dir_up_mass_conscription", "dir_up_order_seven", "dir_up_tunnel_bracing"]

