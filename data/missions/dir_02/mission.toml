# Directorate 02: The Convoy Roads (M8-12 D2). Raid the Authority road posts and the convoys that feed them, then withdraw below.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).

