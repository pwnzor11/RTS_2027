# Directorate 03: The Launch Sites (M8-12 D3). Two Glass Coast launch sites, two fronts: take both, then hold them against the relief columns.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# The sea wraps this map: land units cannot spawn on its edges, so every arrival uses Reinforce.Zone.

