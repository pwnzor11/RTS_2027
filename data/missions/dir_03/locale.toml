# Directorate 03 "The Launch Sites" locale. Speaker: the Voice (leader_dir_larkin); cameos: Fenn (Authority), Strand (Expedition).
"d3.start" = "Two launch sites on the Glass Coast. Take both, then hold them."
"d3.radio.start" = "Commander, this is the Voice. The coast is open and the sky is the colour of old glass. Take the pads. Break the relief."
"d3.radio.fenn" = "Directorate shift, this is Chief Surveyor Fenn, Authority survey. I walked those sites in the Great Drift. They are not yours. Please leave."
"d3.alphamast" = "The Pad Seven watch light is down. Stand a citizen on the pad."
"d3.betamast" = "The Pad Nine watch light is down. Stand a citizen on the pad."
"d3.alpha.held" = "Pad Seven is secure."
"d3.radio.alpha" = "Pad Seven is ours, Commander. The Director held it in trust. It was a long trust."
"d3.beta.held" = "Pad Nine is secure."
"d3.radio.beta" = "Pad Nine is ours. Two pads, and the sea beyond them. The wind is from the east, Commander."
"d3.col1" = "A tenancy relief column comes up from the south!"
"d3.radio.col1" = "The first relief is on the south road. It is making for Pad Seven."
"d3.col2" = "A second relief column comes in from the east!"
"d3.radio.strand" = "Directorate shift, this is Commissioner Strand, Office of Return. Our ships are standing off this coast and we do not wish to be involved. Please do not fire at them."
"d3.relief.down" = "Both relief columns are destroyed."
"d3.radio.relief" = "Both reliefs are broken. The pads stand."
"d3.radio.ridge" = "A tenancy watch post on the ridge. Not required, Commander."
"d3.ridge.down" = "The ridge watch post is destroyed."
"d3.lost" = "The shaft is lost. The coast is lost with it."
"d3.win" = "The launch sites are held. The Glass Coast is the Director's again."
"d3.radio.win" = "Well done, Commander. The Director is pleased. I am pleased. Somewhere out on the water there are lights, and I am not to say what they are."

# Objective and timer labels (the HUD shows the locale text when a label is a key)
"d3.obj.alpha" = "Take Pad Seven: destroy its watch light, then hold the pad"
"d3.obj.beta" = "Take Pad Nine: destroy its watch light, then hold the pad"
"d3.obj.relief" = "Destroy both Authority relief columns"
"d3.obj.ridge" = "Destroy the Authority watch post on the south ridge"
"d3.timer.col1" = "First relief column"
"d3.timer.col2" = "Second relief column"

