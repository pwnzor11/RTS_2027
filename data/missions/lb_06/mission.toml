# Left Behind 06: Salvage Rights (S48 C-12 wave 1, design 22 section 3.3). Play position 3 of the Left Behind campaign, act 1.
# Commando with an economy goal: haulers strip the wrecked Authority supply train on rustbelt_mill before the recovery crews arrive.
# No base: a packed Mother Rig (stays packed), one Yard as the drop point, three haulers and a small war band. Nothing can be built.
# Zones are inclusive cell rectangles [x0, y0, x1, y1], copied from the map header of rustbelt_mill. Pre-placed actors are placed before tick 0.

[mission]
title = "Salvage Rights"
map = "rustbelt_mill.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 1
par_seconds = 120   # S48 sweep sw48b (D-289): tier-3 median win 861 ticks x 2.5, rounded up to a minute
faction = "left_behind"
next = "lb_02"
locale = "locale.toml"

# Q-94 / D-341 Q5 (b): upgrade ids are gated like units. Every upgrade of the faction stays listed here (and in the human tech) so no mission loses one;
# the "(Q5 b)" reward upgrades (design 22) are NOT removed yet, the new reward missions will move them later.
[starts_with]
# S48 ASSUMED: lb_01's end kit (its starts_with plus lb_garage_rig) plus lb_05's unlocks lb_buggy and lb_gleaner. lb_05 lands from wp/s48-lb05.
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_still_rig", "lb_garage_rig", "lb_buggy", "lb_gleaner", "lb_up_ash_wraps", "lb_up_grapple", "lb_up_patchwork", "lb_up_quick_pack", "lb_up_salvage_rights", "lb_up_scrap_plate"]

[unlocks_on_win]
tech = ["lb_hauler", "lb_lookout"]

[[players]]
slot = 0
name = "The Drift"
role = "human"
team = 0
cash = 0
# Only these may be built (production chain prerequisites still apply). There is no yard to build them from: this only keeps the allow-list honest.
tech = ["lb_mother_rig", "lb_dynamo_rig", "lb_muster_rig", "lb_yard", "lb_scavenger", "lb_hook_runner", "lb_slinger", "lb_spike_nest", "lb_still_rig", "lb_garage_rig", "lb_buggy", "lb_gleaner", "lb_up_ash_wraps", "lb_up_grapple", "lb_up_patchwork", "lb_up_quick_pack", "lb_up_salvage_rights", "lb_up_scrap_plate"]

