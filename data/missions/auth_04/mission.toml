# Authority 04: The Sunrise Device (M8-12, D-163). Finale. Cross the river, break the Directorate base, destroy the Sunrise Device (Order Seven, D-086) before it fires.
# Zones are inclusive cell rectangles [x0, y0, x1, y1]. Pre-placed actors are placed before tick 0 (setup log).
# The map is ringed by sea in the south; every reinforcement uses a land zone (Reinforce.Zone), never an edge cell.

[mission]
title = "The Sunrise Device"
map = "ash_reckoning.map.toml"
script = "mission.lua"
briefing = "briefing.md"
seed = 2027
schema = 2
act = 4
faction = "authority"
locale = "locale.toml"

[starts_with]
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier", "auth_signals_hq", "auth_howitzer", "auth_bulwark", "auth_gate", "auth_flak", "auth_airfield", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph"]

[unlocks_on_win]
tech = ["auth_atomic_battery"]

[[players]]
slot = 0
name = "Authority"
role = "human"
team = 0
cash = 8000
# Only these may be built (production chain prerequisites still apply). The script can Tech.Grant more.
tech = ["auth_power", "auth_refinery", "auth_barracks", "auth_rifleman", "auth_jeep", "auth_wall", "auth_turret", "auth_factory", "auth_tank", "auth_engineer", "auth_ration_hall", "auth_engineering", "auth_searchlight", "auth_decon_truck", "auth_marksman", "auth_carrier", "auth_signals_hq", "auth_howitzer", "auth_bulwark", "auth_gate", "auth_flak", "auth_airfield", "auth_rocketeer", "auth_scraper", "auth_silo", "auth_seismograph"]

[[players]]
