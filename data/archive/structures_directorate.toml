[[entry]]
id = "dir_committee_hall"
category = "Structure"
faction = "directorate"
title = "Committee Chamber"
subtitle = "Tier 3 seat of government"
field_note = "VOICE: \"THE COMMITTEE SITS. THE ANNEX LISTENS. THE THIRD AGE BEGINS.\""
body = '''
[DRAFT] A deep council chamber whose long table seats the Committee for its late-night sessions. Its completion opens the third tier of Directorate equipment and powers its research. Delegates are said to vote with their eyes on the door.
'''
