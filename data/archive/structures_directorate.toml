[[entry]]
id = "dir_sunrise"
category = "Structure"
faction = "directorate"
title = "The Sunrise Device"
subtitle = "Buried warhead"
field_note = "VOICE: \"AND AT LAST THE DAWN. ALL CITIZENS SHALL SEE IT.\""
body = '''
A deep chamber with a surface vent and a launch cradle, built around a recovered warhead that is lowered by tunnel to beneath a chosen target. The Directorate calls it the Sunrise and treats it as holy. The Authority calls it a second Exchange in the making.
'''
# ASSUMED (M3-17)
unlock = "encounter:dir_sunrise"


[[entry]]
id = "dir_redoubt"
category = "Structure"
faction = "directorate"
title = "Redoubt"
subtitle = "Garrison strongpoint"
field_note = "VOICE: \"THE REDOUBT IS HALF EARTH, HALF PROMISE. FIVE CITIZENS HOLD IT FOREVER.\""
body = '''
[DRAFT] A half-buried bunker of earth and shuttering with slits at ground level and no gun of its own. Conscripts crowd inside and fire from the dark, which the Annex finds fitting. The Directorate digs one at every road junction it plans to keep.
'''
