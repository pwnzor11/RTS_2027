# Archive entries (M3-17). Text is the owner-approved lore from docs/lore/, copied verbatim.
# Keys: id, category, faction, title, subtitle, field_note (optional), body, sprite (optional),
# unlock (open | campaign:<mission> | encounter:<rules id> | research:<upgrade id>).
# Unit, Structure and Upgrade entries use the rules id as their id; their stats are read live from data/rules.

[[entry]]
id = "auth_conyard"
category = "Structure"
faction = "authority"
title = "Construction Yard"
subtitle = "Base seat of an Authority district"
field_note = "DEPOT 1 // ALL BUILDING STARTS HERE. SIGN THE ROSTER. STOP."
body = '''
A prefabricated depot of cranes, gantries and drawing boards, carried out in crates and assembled on arrival. Every Authority base starts as a yard, and every yard starts with a plan pinned to the wall. The first thing built is a flagpole, the second is a toilet, and the third is a power line.
'''
unlock = "open"

[[entry]]
id = "auth_power"
category = "Structure"
faction = "authority"
title = "Power Plant"
subtitle = "Reactor and turbine hall"
field_note = "POWER 2 // KEEP THE ROD FREE, THE FLOOR DRY, THE DIAL ABOVE ZERO. STOP."
body = '''
A small sealed reactor feeding a turbine and a bank of vacuum-tube regulators. Operators sit on shifts behind a glass window, watching needle gauges and talking to nobody. When the dial drops, the whole base notices.
'''
unlock = "open"

[[entry]]
id = "auth_refinery"
category = "Structure"
faction = "authority"
title = "Ashfall Refinery"
subtitle = "Centrifuge plant"
field_note = "REFINERY 3 // INTAKE, SPIN, SEAL. ASH IN, FUEL OUT. NO SHORTCUTS. STOP."
body = '''
A concrete plant with a chimney stack and a bank of centrifuges, where scraper loads are separated into fuel concentrate. It is the reason a base can exist, and the first thing an enemy wants to hit. Refinery crews wear sealed coveralls and speak to each other through gesture.
'''
unlock = "open"

[[entry]]
id = "auth_barracks"
category = "Structure"
faction = "authority"
title = "Barracks"
subtitle = "Infantry muster hall"
field_note = "BARRACKS 4 // REPORT, ISSUE, DRILL. EVERY BUNK HAS A NAME. STOP."
body = '''
Rows of bunks, a rifle rack, a drill yard and a decon arch at the door. The labour-year draft arrives here to be issued boots and a number, and leaves as a company. Barracks cooks are the best-loved people on any base.
'''
unlock = "open"

[[entry]]
id = "auth_factory"
category = "Structure"
faction = "authority"
title = "Vehicle Factory"
subtitle = "Armoured vehicle works"
field_note = "FACTORY 5 // WELD, FIT, TEST. NOTHING LEAVES WITHOUT A STAMP. STOP."
body = '''
A long shed of overhead cranes and assembly bays where scrapers, scout cars and tanks are built from scratch. Everything is inspected twice, and then once more by a foreman who has been doing it since the First Winter.
'''
unlock = "open"

[[entry]]
id = "auth_silo"
category = "Structure"
faction = "authority"
title = "Storage Silo"
subtitle = "Concentrate store"
field_note = "SILO 6 // STORE DRY, STORE SEALED, COUNT TWICE. STOP."
body = '''
A squat concrete bunker that holds refined concentrate in lead-lined drums. The Authority's rule, written in the Charter, is that a silo is never filled beyond what a district can guard.
'''
unlock = "open"

[[entry]]
id = "auth_wall"
category = "Structure"
faction = "authority"
title = "Perimeter Wall"
subtitle = "Base wall segment"
field_note = "WALL 7 // POURED, NOT PAINTED. HOLD THE LINE. STOP."
body = '''
A section of reinforced slab, stencilled with its district number. Walls are poured by volunteers on weekends and visited by inspectors on Mondays. A sealed ring of them is the Authority's idea of a home.
'''
unlock = "open"

[[entry]]
id = "auth_turret"
category = "Structure"
faction = "authority"
title = "Gun Turret"
subtitle = "Fixed defensive gun"
field_note = "TURRET 8 // POWERED, TRAINED, WATCHED. DO NOT LEAVE UNMANNED. STOP."
body = '''
A shielded gun on a rotating base, powered from the grid and traversed by a gunner in an armoured pit. Turrets are named by the crews who man them, a habit the Administration discourages and cannot stop.
'''
unlock = "open"

[[entry]]
id = "auth_seismograph"
category = "Structure"
faction = "authority"
title = "Seismograph Station"
subtitle = "Underground listening post"
field_note = "SEISMIC 9 // THE GROUND TALKS. LISTEN FOR WHAT SHOULD NOT BE THERE. STOP."
body = '''
A squat hut over a bedrock pillar, with a drum and a pen that scratches a trace on moving paper. Technicians learned to read the trace of a burrowing machine within a season of the first hatch sightings. Their warnings are the Authority's earliest and quietest defence.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "auth_searchlight"
category = "Structure"
faction = "authority"
title = "Searchlight Tower"
subtitle = "Anti-Blackout and night watch"
field_note = "LIGHT 10 // BURN THROUGH THE SMOKE. SEE FIRST, SHOOT SECOND. STOP."
body = '''
A steel mast with a carbon-arc lamp and a reflector big enough to read by from a mile away. The lamp cuts through Blackout smoke and exposes anything in the beam. The Authority's belief is simple: if you light the ground, there is less to fear.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "auth_gate"
category = "Structure"
faction = "authority"
title = "Gate"
subtitle = "Perimeter gate"
field_note = "GATE 11 // OPEN FOR OURS, SHUT FOR THEM. SIGN THE LOG AT EVERY PASSAGE. STOP."
body = '''
A reinforced sliding gate keyed to the district's own vehicles. It opens for friendly convoys and counts as wall for the seal. Gate-keepers are a proud profession and the most unforgiving checkers of papers on the continent.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "auth_engineering"
category = "Structure"
faction = "authority"
title = "Engineering Works"
subtitle = "Research and standards bureau"
field_note = "ENGINEERING 12 // DESIGN, TEST, ISSUE AS BULLETIN. NOTHING IS A SECRET. STOP."
body = '''
A drafting hall and testing yard where new methods are worked out and issued as bulletins. Engineers argue about tolerances for weeks, then release a result that everyone uses for decades.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
