[[entry]]
id = "faction_auth_society"
category = "Faction"
faction = "authority"
title = "A Government of Clerks and Engineers"
subtitle = "Society and government of the Authority"
body = '''
The Authority is governed by councils of the people who keep things running: grid engineers, rail dispatchers, agricultural surveyors, county clerks. Each district elects a Reconstruction Board, the boards send delegates to the Administration, and the Administration answers to a Charter that nobody is allowed to rewrite on a Tuesday. Decisions are slow, minuted and filed in triplicate, and the Authority is proud of it. Slow is how it survived the First Winter without a single coup.

Its people are not united by a leader or a flag but by a ledger. Everyone is counted; everyone is owed a ration, a roof and a hearing. The price is a labour year, served by every citizen in work crews, convoy service or the militia.
'''
unlock = "open"

[[entry]]
id = "faction_auth_daily_life"
category = "Faction"
faction = "authority"
title = "Daily Life Inside the Walls"
subtitle = "Work, ration, decon"
body = '''
A day in a reconstruction town starts with the whistle, the roll call and a decon shower, because ash gets into everything. Bread is baked from grain grown under glass, news arrives as a teletype strip pinned on the depot wall, and the evening is for the district hall, where people argue about drainage with real passion. Children learn arithmetic on slide rules and read the Charter aloud before they read anything else.

The towns are stencilled in grey-green: pipework, painted unit numbers, hand-lettered signs. Anything not bolted down is borrowed from the common pool and returned on time. Fear is real, but it is expressed as maintenance.
'''
unlock = "campaign:auth_02" # M8-13 (tune)

[[entry]]
id = "faction_auth_values"
category = "Faction"
faction = "authority"
title = "What the Authority Is Fighting For"
subtitle = "The reluctant army"
body = '''
The Authority does not want a war. It wants a working grid, a census that adds up, and fields it can plant. Its first principle is that the surface belongs to whoever tends it, and its second is that the people who tend it should be allowed to go home afterwards. The Charter still contains the clause that will dissolve the Authority when its work is done, and the soldiers know it.

That reluctance is also a weakness. The Authority will fortify, repair and wait long past the point where an enemy would have attacked, and it will count the cost of every shell before it fires one.
'''
unlock = "open"

[[entry]]
id = "faction_auth_army"
category = "Faction"
faction = "authority"
title = "The Citizen Army"
subtitle = "How the Authority fights"
body = '''
The army is the labour year with rifles. Riflemen and rocketeers are citizens in service, supported by engineers, decon crews and the convoy drivers who keep them supplied. Its doctrine is the surveyor's: find the ground, hold the ground, then improve the ground. A base has a perimeter, a power grid and a road out. Armour goes forward behind sealed transports because ash kills unprotected infantry, and every column carries clean water.

It is slow and expensive, and it is very hard to dislodge. Its air arm is the last thing it rebuilt, and its artillery is the best on the continent, because the Authority never lost the habit of doing the sums.
'''
unlock = "campaign:auth_03" # M8-13 (tune)

[[entry]]
id = "faction_auth_symbols"
category = "Faction"
faction = "authority"
title = "Marks and Colours"
subtitle = "Symbols of the Authority"
body = '''
The Authority's mark is a toothed gear around a compass rose, stencilled on vehicle doors, depot walls and ration tins. Its colours are working grey, olive green and safety yellow for anything that might move. Units carry painted serial numbers; buildings carry a plate with the name of the district that raised them.

Its anthem is the depot whistle at shift change. Its slogan, which appears on the first line of every teletype header, is plain: COUNT THE LIVING, MEND THE LINE.
'''
unlock = "open"

