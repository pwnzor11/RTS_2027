# Archive entries (M3-17). Text is the owner-approved lore from docs/lore/, copied verbatim.
# Keys: id, category, faction, title, subtitle, field_note (optional), body, sprite (optional),
# unlock (open | campaign:<mission> | encounter:<rules id> | research:<upgrade id>).
# Unit, Structure and Upgrade entries use the rules id as their id; their stats are read live from data/rules.

[[entry]]
id = "dir_conscript"
category = "Unit"
faction = "directorate"
title = "Conscript"
subtitle = "Citizen in service"
field_note = "VOICE: \"CITIZENS IN SERVICE, YOUR SHIFT IS GREAT AND YOUR DEBT IS SMALL. REPORT TO THE HATCH.\""
body = '''
Mustered by the hundreds from the lower levels, conscripts carry a stamped rifle, a respirator that is mostly for show and the belief that the surface was stolen from them. They are cheap, quick and numerous, and the Directorate does not pretend otherwise. Most of them have never seen a sunrise and are very curious about it.
'''
unlock = "open"

[[entry]]
id = "dir_ashthrower"
category = "Unit"
faction = "directorate"
title = "Ash Thrower"
subtitle = "Radiation infantry"
field_note = "VOICE: \"THE GROUND REMEMBERS OUR DEBTS. LET IT COLLECT.\""
body = '''
A conscript with a pressure tank and a lance, throwing concentrated ash across the ground in front of the line. Volunteers are given a hot meal and a longer service credit. They also have a short life expectancy, and the Commissariat is not shy about it.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "dir_sapper"
category = "Unit"
faction = "directorate"
title = "Sapper"
subtitle = "Demolition infantry"
field_note = "VOICE: \"WALLS ARE ONLY A POLITE REQUEST. THE SAPPER ANSWERS.\""
body = '''
Sappers come from the shaft crews who dig and prop the Annex's own tunnels. With a collapse charge on a pole they undermine a wall or gate, and the structure does the rest. The Directorate considers this the most respectable trade below ground.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "dir_informant"
category = "Unit"
faction = "directorate"
title = "Informant"
subtitle = "Stealth observer"
field_note = "VOICE: \"A GOOD CITIZEN IS ALWAYS PRESENT. A BETTER CITIZEN IS NEVER NOTICED.\""
body = '''
Trained by the Commissariat to lie in the ash for hours and report on what they see. They carry no weapon, only a handset and a very quiet disposition. Their reports feed the purges as often as the battle plan, which is why other conscripts are polite to them.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "dir_commissar"
category = "Unit"
faction = "directorate"
title = "Commissar"
subtitle = "Officer of Order"
field_note = "VOICE: \"THE COMMISSARIAT SEES WHAT YOU WILL DO BEFORE YOU DO IT.\""
body = '''
An officer of the Commissariat of Order, in a long coat and a respirator mask. Commissars arrive with the second wave, hold the line by presence and keep a pistol for those who forget they are being watched. The conscripts fight harder near one, and not only out of loyalty.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"

[[entry]]
id = "dir_scraper"
category = "Unit"
faction = "directorate"
title = "Burrowing Scraper"
subtitle = "Tunnel-borne ashfall harvester"
field_note = "VOICE: \"THE SURFACE OWES US A HARVEST. COLLECT IT, CITIZEN, AND COME HOME.\""
body = '''
Built at the Assembly Bore, this scraper tunnels to a drift, surfaces, gathers ash and returns to the Smelter Vent below. It is cheaper and faster to field than the Authority's version and far easier to kill. The Directorate counts that as a fair trade.
'''
unlock = "open"

[[entry]]
id = "dir_bore"
category = "Unit"
faction = "directorate"
title = "Bore"
subtitle = "Entrance digger"
field_note = "VOICE: \"A HATCH WHERE THERE WAS NONE. THE INTERIOR EXTENDS ITS HAND.\""
body = '''
A drill-nosed tracked machine that grinds to a chosen spot, then deploys into a new Hatch. Bore crews are the closest thing the Directorate has to explorers, and they talk with a swagger that the Commissariat politely ignores.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
