[[entry]]
id = "dir_agitprop"
category = "Unit"
faction = "directorate"
title = "Agitprop Crawler"
subtitle = "Loudspeaker support vehicle"
field_note = "VOICE: \"LISTEN, CITIZENS, AND BE STEADY. THE INTERIOR IS WITH YOU.\""
body = '''
A tracked vehicle bristling with horn speakers, carrying the Voice into the field. It steadies and hurries nearby conscripts and floods radio bands so Authority scouts cannot read a map. It is easy to dislike, which is partly the point.
'''
