title = "Field Engineer"
subtitle = "Repair and capture infantry"
field_note = "FIELD MAN 4 // MENDS, SEALS, SIGNS FOR WHAT HE TAKES. NO WEAPON ISSUED. STOP."
body = '''
[DRAFT] The Authority's answer to a broken wall is a clerk with a toolbag and a stamped warrant. The field engineer repairs friendly buildings and, where the district allows, walks into an abandoned or hostile one and claims it for the ledger. He carries no gun and is escorted everywhere he goes.
'''
