body = '''
[DRAFT] A tracked mortar whose shells are fused to burst under the surface, where Directorate bores and tunnel heads think they are safe. It was designed in the engineering offices beside the seismograph stations and works best with their readings in hand. Hatches and bore heads are its favourite targets.
'''
# ASSUMED (M4-INT1) DRAFT for owner approval (D-086): text built from design 08 section 4; replace the open unlock with a mission id when known.
