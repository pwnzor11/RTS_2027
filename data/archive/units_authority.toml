subtitle = "Long-range anti-infantry"
field_note = "FIELD MAN 7 // ONE ROUND, ONE ENTRY IN THE LOG. HOLD THE WINDOW. STOP."
body = '''
[DRAFT] Picked from the rifle ranges for patience rather than courage, the marksman trades speed for reach. Posted at a blockhouse window he is the most feared thing on a street. The Authority issues him few rounds and expects a count at the end of every shift.
'''
