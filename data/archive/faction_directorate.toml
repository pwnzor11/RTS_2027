[[entry]]
id = "faction_dir_voice"
category = "Faction"
faction = "directorate"
title = "The Voice"
subtitle = "Broadcast and propaganda"
body = '''
Every corridor, shaft and surface hatch has a speaker, and every speaker carries the Voice: warm, measured, never hurried. It reads the Director's orders, the shift lists, the weather (always grim) and the lullaby at lights-out. It calls conscripts "citizens in service", the Authority "the tenancy", and a defeat "a redistribution of effort".

Broadcast is also a weapon. Loudspeaker crawlers carry the Voice into the field, where it steadies the faithful and drowns the doubtful. Nobody inside has heard the Director speak live in thirty years, but nobody doubts the Voice speaks for him. That is rather the point.
'''
