[[entry]]
id = "faction_dir_bunker"
category = "Faction"
faction = "directorate"
title = "Forty Years Below"
subtitle = "Bunker culture of the Directorate"
body = '''
The Annex was built for eleven hundred people and has held up to eleven thousand. It runs on shifts, on rank, and on the rule that no one may be seen idle. Rooms are numbered by depth; a person's status is how many levels beneath the first blast door they sleep. Light is rationed, so the Directorate learned to work by dim red lamps and to keep the old habit of whispering. Bone-white concrete, red signal paint, brass speaker grilles in every corridor.

Children born below have never seen a sky. They learn that the surface is not gone but only unreclaimed, an unpaid debt held in trust. This is not a story they are told to believe. It is the only world they have, and the Directorate has made it work.
'''
unlock = "open"

[[entry]]
id = "faction_dir_ideology"
category = "Faction"
faction = "directorate"
title = "The Doctrine of Reclamation"
subtitle = "Why the Directorate believes it must surface"
body = '''
From inside, the logic is airtight. The Director held the government of the whole continent in trust, therefore the government is the Annex, and the people above are runaway tenants. The surface is not an enemy but unfinished business. Ash is not poison but the debt left by those who failed to hold the line. Every conscript below pays down that debt with a service year; every acre reclaimed is a payment received.

There is also a quieter reason. The Annex is failing. Reactors age, air plants clog, and the old shafts cannot hold another generation. The Directorate cannot say this aloud, so it says "Reclamation" instead, with great confidence and at volume.
'''
