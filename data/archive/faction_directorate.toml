[[entry]]
id = "faction_dir_surfacing"
category = "Faction"
faction = "directorate"
title = "Why the Directorate Came Up"
subtitle = "The surfacing, 1985 to 2001"
body = '''
The Annex held on for two generations by trimming its numbers and tightening its rules. In 1994, when Shaft Seven flooded and its reactor failed, the margin vanished. The Commissariat of Order, which had always policed the shifts, took over planning, and its plan was simple: go up, take the fields, take the launch sites, take the world back to the Director.

The Directorate does not think of this as invasion. It thinks of it as the end of a forty-year emergency. Its engineers bore under the Rust Belt, its conscripts surface in the ash, and its loudspeakers announce that the Interior has returned. Many who are sent up believe every word. A few begin to notice the sky.
'''
