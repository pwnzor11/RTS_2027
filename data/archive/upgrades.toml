faction = "authority"
title = "Tungsten Shot"
subtitle = "Armour-piercing tank rounds"
field_note = "BULLETIN 31 // HEAVY SHOT FOR HEAVY TARGETS. COUNT EVERY ROUND. STOP."
body = '''
Dense tungsten-cored shells for the tank cannon, issued from the district's tightest stores. Each round hits harder. Nobody is allowed to waste one on practice.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
