subtitle = "Radiation-proof infantry"
field_note = "VOICE: \"LEAD IS THE ONLY HONEST COAT. WEAR IT AND WALK.\""
body = '''
Sheets of lead sewn into every Directorate uniform make its infantry nearly proof against radiation. They can walk through the glow that stops others. The coats are heavy and the soldiers like them anyway.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
