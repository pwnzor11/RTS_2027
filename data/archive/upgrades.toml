title = "Mass Conscription"
subtitle = "Cheaper, faster conscripts"
field_note = "VOICE: \"THE ANNEX HAS ALWAYS HAD MANY HANDS. NOW IT WILL USE THEM.\""
body = '''
A Committee decree that widens the draft and shortens the training. Conscripts cost less and come out of the muster hatches faster. The decree is read aloud at every shaft.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_tunnel_bracing"
category = "Upgrade"
faction = "directorate"
title = "Tunnel Bracing"
subtitle = "Faster hatch and bore head work"
field_note = "VOICE: \"A BRACED TUNNEL IS A PATIENT TUNNEL. LET THEM BE PATIENT.\""
body = '''
Timber and iron props in the tunnel mouths speed up work at hatches and bore heads. Crews dig faster and with less fear of the roof. Shaft foremen are paid by the metre.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
