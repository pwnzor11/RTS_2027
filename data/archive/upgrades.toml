faction = "authority"
title = "Sodium Lamps"
subtitle = "Brighter searchlight beams"
field_note = "BULLETIN 22 // ORANGE LIGHT, LONG REACH. STOP."
body = '''
New lamps in the searchlight towers throw an orange beam much farther than the old arc. Towers see further into the dark and the smoke. The lamp operators complain only about the heat.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_tungsten_shot"
