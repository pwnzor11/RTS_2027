# Archive entries (M3-17). Text is the owner-approved lore from docs/lore/, copied verbatim.
# Keys: id, category, faction, title, subtitle, field_note (optional), body, sprite (optional),
# unlock (open | campaign:<mission> | encounter:<rules id> | research:<upgrade id>).
# Unit, Structure and Upgrade entries use the rules id as their id; their stats are read live from data/rules.

[[entry]]
id = "auth_grouting"
category = "Upgrade"
faction = "authority"
title = "Foundation Grouting"
subtitle = "Hardened ground inside the walls"
field_note = "ENGINEERING BULLETIN 11 // POUR, SET, CURE. IF THE WALL HOLDS, THE FLOOR HOLDS. STOP."
body = '''
Researched at the Engineering Works, Foundation Grouting fills the soft ground enclosed by a base's walls, gates and buildings with quick-curing concrete slurry. Nothing can surface or break through there. The Authority thinks of it as the civil engineer's reply to tunnelling: pour the floor and be done with it. A single broken wall panel spoils the seal, which is why work crews inspect the perimeter every morning.
'''
# ASSUMED (M3-17) TODO (M4): replace TBD with the mission id that releases this entry.
unlock = "campaign:TBD"


[[entry]]
id = "auth_up_flak_vests"
category = "Upgrade"
faction = "authority"
title = "Flak Vests"
subtitle = "Padded infantry armour"
field_note = "BULLETIN 14 // WEAR THE VEST. SIGN FOR THE VEST. RETURN THE VEST. STOP."
body = '''
Quilted, steel-plated vests issued to every infantryman of the district. They add a measure of toughness to riflemen and engineers alike. Quartermasters count them in at the end of each shift.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_convoy_drill"
category = "Upgrade"
faction = "authority"
title = "Convoy Drill"
subtitle = "Faster light vehicles"
field_note = "BULLETIN 15 // KEEP STATION. KEEP SPEED. KEEP THE INTERVAL. STOP."
body = '''
A standard drill that trains drivers to keep a tight interval at speed. Scout cars, scrapers and carriers all move faster. The drill sergeants paint the interval on the road.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

