# Archive entries (M3-17). Text is the owner-approved lore from docs/lore/, copied verbatim.
# Keys: id, category, faction, title, subtitle, field_note (optional), body, sprite (optional),
# unlock (open | campaign:<mission> | encounter:<rules id> | research:<upgrade id>).
# Unit, Structure and Upgrade entries use the rules id as their id; their stats are read live from data/rules.

[[entry]]
id = "auth_grouting"
category = "Upgrade"
faction = "authority"
title = "Foundation Grouting"
subtitle = "Hardened ground inside the walls"
field_note = "ENGINEERING BULLETIN 11 // POUR, SET, CURE. IF THE WALL HOLDS, THE FLOOR HOLDS. STOP."
body = '''
Researched at the Engineering Works, Foundation Grouting fills the soft ground enclosed by a base's walls, gates and buildings with quick-curing concrete slurry. Nothing can surface or break through there. The Authority thinks of it as the civil engineer's reply to tunnelling: pour the floor and be done with it. A single broken wall panel spoils the seal, which is why work crews inspect the perimeter every morning.
'''
unlock = "campaign:auth_02" # M8-13 (tune)


[[entry]]
id = "auth_up_flak_vests"
category = "Upgrade"
faction = "authority"
title = "Flak Vests"
subtitle = "Padded infantry armour"
field_note = "BULLETIN 14 // WEAR THE VEST. SIGN FOR THE VEST. RETURN THE VEST. STOP."
body = '''
Quilted, steel-plated vests issued to every infantryman of the district. They add a measure of toughness to riflemen and engineers alike. Quartermasters count them in at the end of each shift.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_convoy_drill"
category = "Upgrade"
faction = "authority"
title = "Convoy Drill"
subtitle = "Faster light vehicles"
field_note = "BULLETIN 15 // KEEP STATION. KEEP SPEED. KEEP THE INTERVAL. STOP."
body = '''
A standard drill that trains drivers to keep a tight interval at speed. Scout cars, scrapers and carriers all move faster. The drill sergeants paint the interval on the road.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_composite_armour"
category = "Upgrade"
faction = "authority"
title = "Composite Armour"
subtitle = "Thicker tank plating"
field_note = "BULLETIN 21 // LAYERED PLATE, LAYERED TRUST. STOP."
body = '''
Steel, rubber and ceramic bonded together in tank and Bulwark hulls. Machines take more hits before they fall. The foundry works through the night to fit the plates.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_sodium_lamps"
category = "Upgrade"
faction = "authority"
title = "Sodium Lamps"
subtitle = "Brighter searchlight beams"
field_note = "BULLETIN 22 // ORANGE LIGHT, LONG REACH. STOP."
body = '''
New lamps in the searchlight towers throw an orange beam much farther than the old arc. Towers see further into the dark and the smoke. The lamp operators complain only about the heat.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_tungsten_shot"
category = "Upgrade"
faction = "authority"
title = "Tungsten Shot"
subtitle = "Armour-piercing tank rounds"
field_note = "BULLETIN 31 // HEAVY SHOT FOR HEAVY TARGETS. COUNT EVERY ROUND. STOP."
body = '''
Dense tungsten-cored shells for the tank cannon, issued from the district's tightest stores. Each round hits harder. Nobody is allowed to waste one on practice.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "auth_up_signals_net"
category = "Upgrade"
faction = "authority"
title = "Signals Net"
subtitle = "Wider base sight"
field_note = "BULLETIN 32 // MORE WIRES, MORE EYES. STOP."
body = '''
A network of lines and relays tying every building to the Signals Headquarters. Each structure sees further across the district. Operators note every contact in the log.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_mass_conscription"
category = "Upgrade"
faction = "directorate"
title = "Mass Conscription"
subtitle = "Cheaper, faster conscripts"
field_note = "VOICE: \"THE ANNEX HAS ALWAYS HAD MANY HANDS. NOW IT WILL USE THEM.\""
body = '''
A Committee decree that widens the draft and shortens the training. Conscripts cost less and come out of the muster hatches faster. The decree is read aloud at every shaft.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_tunnel_bracing"
category = "Upgrade"
faction = "directorate"
title = "Tunnel Bracing"
subtitle = "Faster hatch and bore head work"
field_note = "VOICE: \"A BRACED TUNNEL IS A PATIENT TUNNEL. LET THEM BE PATIENT.\""
body = '''
Timber and iron props in the tunnel mouths speed up work at hatches and bore heads. Crews dig faster and with less fear of the roof. Shaft foremen are paid by the metre.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_hot_cores"
category = "Upgrade"
faction = "directorate"
title = "Hot Cores"
subtitle = "More radiation per shell"
field_note = "VOICE: \"A HOTTER CORE GIVES A LONGER MEMORY. LET THE GROUND REMEMBER.\""
body = '''
Reactor slag packed into the crawler's rounds so each shell leaves more radiation behind. The ground stays deadly for longer. Handlers use tongs.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_lead_lining"
category = "Upgrade"
faction = "directorate"
title = "Lead Lining"
subtitle = "Radiation-proof infantry"
field_note = "VOICE: \"LEAD IS THE ONLY HONEST COAT. WEAR IT AND WALK.\""
body = '''
Sheets of lead sewn into every Directorate uniform make its infantry nearly proof against radiation. They can walk through the glow that stops others. The coats are heavy and the soldiers like them anyway.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_blackout_canisters"
category = "Upgrade"
faction = "directorate"
title = "Blackout Canisters"
subtitle = "Longer Blackout smoke"
field_note = "VOICE: \"THE DARK IS A GIFT. WE GIVE MORE OF IT.\""
body = '''
Larger canisters in the dirigible's bomb bays stretch the Blackout over a bigger span of time. Enemy sight stays shut for longer. Loaders work by feel.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_order_seven"
category = "Upgrade"
faction = "directorate"
title = "Order Seven"
subtitle = "Faster Sunrise charging"
field_note = "VOICE: \"ORDER SEVEN WAS SIGNED IN THE NIGHT. THE SUNRISE WILL HURRY.\""
body = '''
A secret Committee order that puts every spare reactor hand onto the Sunrise Device. The device charges much faster. Few outside the Committee have read it.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

[[entry]]
id = "dir_up_fervour"
category = "Upgrade"
faction = "directorate"
title = "Fervour"
subtitle = "Tougher, faster-firing conscripts"
field_note = "VOICE: \"A CITIZEN WHO BELIEVES IS A CITIZEN WHO HOLDS. FIRE, CITIZENS, FIRE.\""
body = '''
Rallies, songs and extra rations push conscripts to fight harder and shoot faster. They take a few more hits than before. The Commissars say it cannot be trained, only inspired.
'''
# Approved by the owner 2026-11-04 (Q-38). Replace the open unlock with a mission id when known.
unlock = "open"

# Left Behind upgrades (S9, M6-ARCH). Text from docs/lore/left_behind.md; the ones marked ASSUMED (S9) are drafts.

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_scrap_plate"
category = "Upgrade"
faction = "left_behind"
title = "Scrap Plate"
subtitle = "Armour from the wreck yard"
field_note = "CHALK BOARD // PLATE ON. IT RATTLES. IT STAYS ON."
body = '''
Rolled sheets from a dozen wrecks, each a different thickness, welded over the vehicle's weak points. The plate adds to the armour of every vehicle in the camp. It makes the machine heavier and noisier, and drivers complain they can hear themselves coming. The Speaker says a noisy vehicle is a vehicle that lives, and she has not yet been wrong about it.
'''
unlock = "research:lb_up_scrap_plate"

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_ash_wraps"
category = "Upgrade"
faction = "left_behind"
title = "Ash Wraps"
subtitle = "Sail-cloth against the glow"
field_note = "RIG RADIO // WRAPS ON. KEEP THE HOOD UP. MA SAYS THE GLOW IS NOT A COLOUR."
body = '''
Layers of sail-cloth stitched with lead thread and dipped in grey resin, worn over the chest and shoulders. Ash Wraps reduce the radiation that rises from the glowing drifts, so infantry can stay in the open longer and push further without falling back. They are heavy, hot and smell of resin. Every Veilwalker wears a set, and most Tinkers wear them under their coats.
'''
unlock = "research:lb_up_ash_wraps"

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_quick_pack"
category = "Upgrade"
faction = "left_behind"
title = "Quick Pack"
subtitle = "Faster folding"
field_note = "CHALK BOARD // PACK IN SIXTEEN. PACK IN SIXTEEN OR SLEEP IN THE ASH."
body = '''
A set of cable pulleys, spring latches and a foot pedal that lets a crew fold a rig in well under the usual time. Every crew agrees it saves lives during a raid. Before Quick Pack, a camp had to be packed in a quiet hour. After it, a camp can leave as soon as the first flare goes up over the ridge.
'''
unlock = "research:lb_up_quick_pack"

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_grapple"
category = "Upgrade"
faction = "left_behind"
title = "Grapple Hooks"
subtitle = "Heavier hooks, looser walls"
field_note = "RIG RADIO // HOOKS READY. HE WILL NOT KNOW WHAT HIT HIM. NEITHER WILL THE WALL."
body = '''
Stronger hooks, a longer line and a steel spike on the end of each throw. Hook Runners with grapples take more from a silo before the alarm, and they can tear a gap through a wall for a few seconds before it knits back. The younger runners call Grapple Hooks the best thing the Bench has produced since the Patchwork.
'''
unlock = "research:lb_up_grapple"

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_salvage_rights"
category = "Upgrade"
faction = "left_behind"
title = "Salvage Rights"
subtitle = "Every wreck counts"
field_note = "CHALK BOARD // SALVAGE RIGHTS SIGNED. EVERY WRECK IS OURS. EVERY ONE."
body = '''
A written claim, signed at the Gathering, that the caravan has first right to every wreck on the Drift. In practice it means better paperwork for the crews who find the wrecks, faster hauling with the Salvage Hauler, and more value for every scrap that comes home. Three other camps dispute the claim. The caravans have never bothered to answer them, because the wrecks keep coming home.
'''
unlock = "research:lb_up_salvage_rights"

# S9 draft, approved by the owner (D-134) (docs/lore/left_behind.md).
[[entry]]
id = "lb_up_patchwork"
category = "Upgrade"
faction = "left_behind"
title = "Patchwork"
subtitle = "Repairs at a distance"
field_note = "RIG RADIO // PATCH KIT LIVE. TINKER ON THE HILL, TANK IN THE SAND. DON'T MOVE, WE ARE COMING."
body = '''
A long-range repair kit rigged from a welder, a radio and a spare set of fittings, carried by Tinkers who can now mend vehicles from across a field. Patchwork lets a Tinker keep a convoy running under fire. It is the thing Tinkers most want to do and the thing they are most often told to stop. The result is a fighting rig that never quite matches the one it started as, which is the caravan's whole philosophy in one machine.
'''
unlock = "research:lb_up_patchwork"

# Expedition upgrades (S11, M7-10). Text copied verbatim from docs/lore/expedition.md (owner-approved lore, D-128/D-148).
# The lore gives no field notes for upgrades yet: field_notes below are lead drafts until the owner confirms them.

[[entry]]
id = "exp_up_sonar_nets"
category = "Upgrade"
faction = "expedition"
title = "Sonar Nets"
subtitle = "Wider picket listening"
field_note = "HYDROGRAPHIC NOTE 4 // NETS LAID ON EVERY PICKET LINE. THE SEA IS LOUDER THAN IT LOOKS. TELEX ENDS."
body = '''
Cable nets lowered between the Pickets and the shore, which extend the range of each listening post and reveal submerged boats to the whole team for a short time after they are heard. The nets are heavy to lay and cheap to keep, and the sailors who lay them say the sea sounds different once they are in.
'''
unlock = "campaign:exp_01" # M8-13 (tune)

[[entry]]
id = "exp_up_hardened_hulls"
category = "Upgrade"
faction = "expedition"
title = "Hardened Hulls"
subtitle = "Heavier ship armour"
field_note = "DRYDOCK NOTE 9 // EVERY SEAM WELDED TWICE. THE PLATES ARE HEAVY AND THE ADMIRAL SAYS MORE. TELEX ENDS."
body = '''
A programme of extra steel plating welded over the original hull seams in the drydocks of the home ports. Every warship in the fleet gains armour from it, though each new plate adds weight, and the engineers argue constantly about how much weight a hull can carry before it stops being fast. The Admiral has ruled that the answer is always more.
'''
unlock = "campaign:exp_02" # M8-13 (tune)

[[entry]]
id = "exp_up_vacuum_cores"
category = "Upgrade"
faction = "expedition"
title = "Vacuum Cores"
subtitle = "Faster vehicle reloads"
field_note = "CARROW DOWN 3 // NEW TUBES FITTED. THEY GLOW FAINTER AND THE GUNS FIRE OFTEN. DO NOT ADMIRE THEM. TELEX ENDS."
body = '''
Improved valve tubes that run cooler under load, so the guns of every fleet vehicle can fire more often. Crews notice at once, since the new tubes glow a fainter colour and need less attention between engagements. The engineers at Carrow Down remain modest about the work, though privately they believe these are the finest tubes they have ever built.
'''
unlock = "campaign:auth_03" # M8-13 (tune)

[[entry]]
id = "exp_up_composite_armour"
category = "Upgrade"
faction = "expedition"
title = "Composite Armour"
subtitle = "Hover and infantry armour"
field_note = "LABORATORY NOTE 7 // CERAMIC AND RESIN ON EVERY SKIRT AND CHEST PLATE. IT SMELLS OF THE LAB. TELEX ENDS."
body = '''
Layered plates of ceramic and resin fitted to hovercraft skirts, troop carriers and the chest plates of infantry. It stops small arms and splinters that once went straight through, and it weighs less than the steel it replaces. Veterans complain that it smells of a laboratory, though they rarely complain about the first round that bounces away from them.
'''
unlock = "campaign:auth_03" # M8-13 (tune)

[[entry]]
id = "exp_up_guided_shells"
category = "Upgrade"
faction = "expedition"
title = "Guided Shells"
subtitle = "Better artillery accuracy"
field_note = "SPOTTER BULLETIN 2 // THE SHELL CORRECTS ITSELF IN FLIGHT. THE GUNNER TAKES THE CREDIT. FIT THE VANES BY HAND. TELEX ENDS."
body = '''
Shells fitted with small steering vanes and a simple radio receiver, which let the fleet's artillery correct its fall of shot in flight. Spotters are delighted, gunners are sceptical, and the Admiral is pleased, because fewer shells are wasted on empty ground. The vanes are fragile and must be fitted by hand, so the armourers keep a stool beside every crate.
'''
unlock = "campaign:exp_02" # M8-13 (tune)

[[entry]]
id = "exp_up_fast_charging"
category = "Upgrade"
faction = "expedition"
title = "Fast Charging"
subtitle = "Shorter shipment intervals"
field_note = "OFFICE OF RETURN 12 // CRANES UP, NIGHT SHIFTS LIT. THE TENDERS COME IN FASTER, AND SO DO THE BILLS. TELEX ENDS."
body = '''
A revised loading system for the supply tenders and quays, with extra cranes, faster winches and better-lit night shifts. Shipments reach the beachhead about fifteen per cent sooner than before. The Commissioner approved the programme at once, and was the first to point out that every saved minute is one the fleet does not have to sit waiting for its bills.
'''
unlock = "campaign:dir_03" # M8-13 (tune)

[[entry]]
id = "exp_up_deep_survey"
category = "Upgrade"
faction = "expedition"
title = "Deep Survey"
subtitle = "Larger skimmer loads"
field_note = "HYDROGRAPHIC NOTE 11 // HOPPERS DEEPENED, SKIMMERS SITTING LOW. MORE ASH PER RUN, MORE TIME ON THE SURFACE. TELEX ENDS."
body = '''
A survey package fitted to the skimmers that improves their sensors and deepens the hoppers, so each harvest run carries more ash before returning. Operators say the extra load makes the hulls sit lower in the water and the coffee taste worse, since the crew now spends longer on the surface. The Hydrographic Office calls the package a triumph and the skimmer crews call it a burden.
'''
unlock = "campaign:auth_02" # M8-13 (tune)

[[entry]]
id = "exp_up_veteran_drill"
category = "Upgrade"
faction = "expedition"
title = "Veteran Drill"
subtitle = "Earlier veteran status"
field_note = "BARRACKS ORDER 5 // THE DRILL IS SIMPLE. RUN IT TWICE. VETERANS COME SOONER. TELEX ENDS."
body = '''
A rigorous training regime drawn up by the fleet's old sergeants and given a new name by the Office of Return, which spent a great deal of money on it. Units that complete the drill earn veteran status after fewer engagements, and they tend to keep their nerve longer under fire. The sergeants say the drill is simple, and then make the recruit do it twice.
'''
unlock = "campaign:auth_03" # M8-13 (tune)

