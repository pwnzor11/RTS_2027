cliff_plateaus = 0
rivers = 1
river_width = 1
river_wander_permille = 0
ford_spacing = 20
road_grid = 16
ocean_width = 0
ash_fields_per_start = 3
pitch_fields_per_start = 1
contested_fields = 2
extra_fields = 2
field_density_min = 3
field_density_max = 12
ruins = 2


