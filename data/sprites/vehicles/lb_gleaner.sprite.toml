# Sprite manifest for lb_gleaner (Left Behind Gleaner (ash harvester)). Generated by tools/art/build_vehicle.py -- do not hand-edit.
# Sheet: 13 columns of 240 px frames, row-major. Frame 0 faces north, facings run clockwise in 360 / facings deg steps.
# Frame of facing f, animation step k in a state = first + f * frames + k.
# Origin: pixel on the ground contact point (cell centre), counted from the frame's top-left corner.
# Camera: orthographic, 40 deg elevation, sun upper-left, 80 px per cell (D-275: the drawn size; art/pilot/README.md).

file = "lb_gleaner.png"
frame_w = 240
frame_h = 240
origin_x = 120
origin_y = 140
px_per_cell = 80

# House paint is the 8-shade magenta ramp, darkest first. Exact RGB matches are house pixels; alpha is always 0 or 255.
[house]
ramp = ["#400040", "#5B125B", "#772577", "#923792", "#AD49AD", "#C85BC8", "#E46EE4", "#FF80FF"]

[[state]]
name = "idle"
facings = 32
frames = 1
first = 0
ticks_per_frame = 1

[[state]]
name = "move"
facings = 32
frames = 4
first = 32
ticks_per_frame = 1
step_px = 3.57

# FX anchors (BACKLOG V-05), written by `build_vehicle.py <id> --anchors-only` (builds the model, renders nothing, leaves the sheet alone).
# [dx, dy] in sheet pixels from this sheet's origin pixel (x right, y down; scale like origin_x, i.e. by 64 / px_per_cell), one per
# facing of the first state (index = facing, 0 = north, clockwise), taken through the same camera as the sheet.
# muzzle: where a shot leaves the barrel tip. On a <id>_turret sheet it is relative to the turret origin (the ground point under the
# pivot, add the pivot offset of the hull facing) and the index is the TURRET facing; on a body sheet it is a fixed gun, index = hull facing.
# dust: where the ground contact ends at the back (centre of the rear of the tracks or wheels); body sheet only.
# Absent table or key = the renderer's default offsets.
# dust source: rear ground contact centre (y = -2.39, world units)
[anchors]
dust = [[0, 36], [-11, 35], [-22, 33], [-31, 30], [-40, 25], [-47, 20], [-52, 14], [-55, 7], [-56, 0], [-55, -7], [-52, -14], [-47, -20], [-40, -26], [-31, -30], [-22, -34], [-11, -36], [0, -36], [11, -36], [22, -34], [31, -30], [40, -26], [47, -20], [52, -14], [55, -7], [56, 0], [55, 7], [52, 14], [47, 20], [40, 25], [31, 30], [22, 33], [11, 35]]
