# Sprite manifest for lb_kite (Left Behind Kite (glider bomber)). Generated by tools/art/build_vehicle.py -- do not hand-edit.
# Sheet: 4 columns of 192 px frames, row-major. Frame 0 faces north, facings run clockwise in 22.5 deg steps.
# Frame of facing f, animation step k in a state = first + f * frames + k.
# Origin: pixel on the ground contact point (cell centre), counted from the frame's top-left corner.
# Camera: orthographic, 40 deg elevation, sun upper-left, 64 px per cell (art/pilot/README.md).
# LAYER shadow: ground shadow only (1-bit, dithered, colour = palette index 1), same frame, origin and facing as the
# body sheet. Draw it first, at the unit's ground position; the body sheet (no shadow) is drawn on top. The body is
# baked at altitude 2.40 world units (0.71 cell), so the body sprite already floats above its
# ground origin and the shadow falls to the lower right of it.

file = "lb_kite_shadow.png"
frame_w = 192
frame_h = 192
origin_x = 96
origin_y = 131

layer = "shadow"
altitude = 0.7059

# House paint is the 8-shade magenta ramp, darkest first. Exact RGB matches are house pixels; alpha is always 0 or 255.
[house]
ramp = ["#400040", "#5B125B", "#772577", "#923792", "#AD49AD", "#C85BC8", "#E46EE4", "#FF80FF"]

[[state]]
name = "idle"
facings = 16
frames = 1
first = 0
ticks_per_frame = 1
