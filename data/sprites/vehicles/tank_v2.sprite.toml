# Sprite manifest for the Authority medium tank (id "tank_v2", sheet tank_v2.png, the v2 pilot from art/pilot).
# Migrated from tank_v2.toml (format v1). The tank has one state, "idle": 16 facings, 1 frame each.
#
# Sheet: 384 x 384 px, 4 x 4 cells of 96 px, row-major. Frame 0 faces north, facings run clockwise in 22.5 deg steps.
# Camera: orthographic, elevation 40 deg, sun upper-left (see art/pilot/README.md, v2 section).
#
# Origin: for a vehicle, the pixel that sits on the ground contact point, i.e. the cell centre, counted from the
# frame's top-left corner. (For a building the origin is instead the top-left pixel of the footprint's top-left cell.)

file = "tank_v2.png"
frame_w = 96
frame_h = 96
origin_x = 48
origin_y = 64

# House paint is the 8-shade magenta ramp, darkest first. Exact RGB matches are house pixels; alpha is always 0 or 255.
[house]
ramp = ["#400040", "#5B125B", "#772577", "#923792", "#AD49AD", "#C85BC8", "#E46EE4", "#FF80FF"]

[[state]]
name = "idle"
facings = 16
frames = 1
first = 0
ticks_per_frame = 1
