# Sprite manifest for dir_dirigible (Directorate Dirigible (armoured airship)). Generated by tools/art/build_vehicle.py -- do not hand-edit.
# Sheet: 4 columns of 224 px frames, row-major. Frame 0 faces north, facings run clockwise in 22.5 deg steps.
# Frame of facing f, animation step k in a state = first + f * frames + k.
# Origin: pixel on the ground contact point (cell centre), counted from the frame's top-left corner.
# Camera: orthographic, 40 deg elevation, sun upper-left, 64 px per cell (art/pilot/README.md).
# LAYER body: airframe at altitude, no shadow (the shadow is a separate sheet, <id>_shadow.png).

file = "dir_dirigible.png"
frame_w = 224
frame_h = 224
origin_x = 112
origin_y = 138

layer = "body"
altitude = 0.5882

# House paint is the 8-shade magenta ramp, darkest first. Exact RGB matches are house pixels; alpha is always 0 or 255.
[house]
ramp = ["#400040", "#5B125B", "#772577", "#923792", "#AD49AD", "#C85BC8", "#E46EE4", "#FF80FF"]

[[state]]
name = "idle"
facings = 16
frames = 1
first = 0
ticks_per_frame = 1
