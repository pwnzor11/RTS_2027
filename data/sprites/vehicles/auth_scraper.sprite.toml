# Sprite manifest for auth_scraper (Authority armoured scraper (ashfall harvester)). Generated by tools/art/build_vehicle.py -- do not hand-edit.
# Sheet: 17 columns of 140 px frames, row-major. Frame 0 faces north, facings run clockwise in 360 / facings deg steps.
# Frame of facing f, animation step k in a state = first + f * frames + k.
# Origin: pixel on the ground contact point (cell centre), counted from the frame's top-left corner.
# Camera: orthographic, 40 deg elevation, sun upper-left, 80 px per cell (D-275: the drawn size; art/pilot/README.md).

file = "auth_scraper.png"
