# Sprite manifest for exp_carrier (Expedition Carrier). Generated by tools/art/build_vehicle.py -- do not hand-edit.
# Sheet: 6 columns of 160 px frames, row-major. Frame 0 faces north, facings run clockwise in 360 / facings deg steps.
# Frame of facing f, animation step k in a state = first + f * frames + k.
# Origin: pixel on the ground contact point (cell centre), counted from the frame's top-left corner.
# Camera: orthographic, 40 deg elevation, sun upper-left, 80 px per cell (D-275: the drawn size; art/pilot/README.md).
# LAYER turret: the turret only, 32 facings = TURRET facing (independent of the hull). The turret pivot sits at the
# frame origin: draw this frame with its origin on the ground point under the pivot, i.e. at the hull origin plus
# the pivot offset rotated by the HULL facing (pivot_x east / pivot_y forward, in cells at hull facing 0; forward
# is up-screen at 40 deg elevation, so screen dy = -(forward * px_per_cell * sin 40); no height term: the turret keeps its height inside the frame, pivot_z is informational). No shadow here:
# the body sheet's shadow already contains the turret.

file = "exp_carrier_turret.png"
frame_w = 160
frame_h = 160
origin_x = 80
origin_y = 84
px_per_cell = 80

layer = "turret"
pivot_x = 0.0000
pivot_y = 0.4050
pivot_z = 0.1458

# House paint is the 8-shade magenta ramp, darkest first. Exact RGB matches are house pixels; alpha is always 0 or 255.
[house]
ramp = ["#400040", "#5B125B", "#772577", "#923792", "#AD49AD", "#C85BC8", "#E46EE4", "#FF80FF"]

[[state]]
name = "idle"
facings = 32
frames = 1
first = 0
ticks_per_frame = 1

# FX anchors (BACKLOG V-05), written by `build_vehicle.py <id> --anchors-only` (builds the model, renders nothing, leaves the sheet alone).
# [dx, dy] in sheet pixels from this sheet's origin pixel (x right, y down; scale like origin_x, i.e. by 64 / px_per_cell), one per
# facing of the first state (index = facing, 0 = north, clockwise), taken through the same camera as the sheet.
# muzzle: where a shot leaves the barrel tip. On a <id>_turret sheet it is relative to the turret origin (the ground point under the
# pivot, add the pivot offset of the hull facing) and the index is the TURRET facing; on a body sheet it is a fixed gun, index = hull facing.
# dust: where the ground contact ends at the back (centre of the rear of the tracks or wheels); body sheet only.
# Absent table or key = the renderer's default offsets.
# muzzle source: barrel: gmouth0,gmouth1 (relative to the turret origin, index = turret facing)
[anchors]
muzzle = [[0, -18], [2, -18], [4, -18], [6, -17], [8, -16], [9, -15], [10, -14], [11, -12], [11, -11], [11, -10], [10, -8], [9, -7], [8, -6], [6, -5], [4, -4], [2, -4], [0, -4], [-2, -4], [-4, -4], [-6, -5], [-8, -6], [-9, -7], [-10, -8], [-11, -10], [-11, -11], [-11, -12], [-10, -14], [-9, -15], [-8, -16], [-6, -17], [-4, -18], [-2, -18]]
