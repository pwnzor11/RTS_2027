# Sprite manifest for lb_scavenger (Left Behind Scavenger). Generated by tools/art/build_infantry.py -- do not hand-edit.
# Sheet: 840 x 780 px, 14 columns x 13 rows of 60 x 60 px frames, row-major.
# Frame index inside a state = first + facing * frames + step. Facing 0 = north, clockwise, 360 / facings deg steps (16 facings, D-276).
# Camera: orthographic, elevation 40 deg, sun upper-left; figure scale 1.25 x the tank scale, 80 px per cell (D-275).
#
# Origin: the pixel the soldier's feet stand on, i.e. the sub-slot centre (up to 5 soldiers share a 64 px cell),
# counted from the frame's top-left corner. The ground shadow falls to the right/below of it.
# State "die" has one facing (drawn facing east: a forward fall to the right); mirror it in code if wanted.
# States die_blast, die_burn, die_rad (same rules as "die"): flung and tumbling, burning, radiation slump and fade.

