# Authority M2 roster: balance pass in M2-14, see docs/balance/m2_balance.md.
# Keys: speed, max_health, armor, sight, primary_weapon ("" = none), cost, prerequisites. Optional: build_time.
# Infantry have no locomotion key (they move on foot).
# Schema v3 (M3, all optional): as vehicles (tunnel_size defaults to "S") but no passengers/deploys_into; plus engineer.

[auth_rifleman]
tier = 1
speed = 12
max_health = 50
armor = "unarmored"
sight = 4
primary_weapon = "auth_rifle"
cost = 100
prerequisites = ["auth_barracks"]

[auth_rocketeer]
tier = 1
speed = 10
max_health = 60
armor = "unarmored"
sight = 5
primary_weapon = "auth_rocket"
cost = 300
prerequisites = ["auth_barracks"]

