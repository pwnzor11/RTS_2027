# Authority M2 roster: balance pass in M2-14, see docs/balance/m2_balance.md.
# Keys: versus = damage percent (0..1000) per armour class, in the order Unarmored, Light, Heavy, Structure,
# Fortified, ShipLight, ShipHeavy, Submerged (M7-02: the last three are padded with 100, or 0 for the all-zero warheads; a shorter
# five-entry list is padded with 100 by the loader). splash: 0 = target only, 1 = 3x3 block with falloff. hits_allies: whether splash hurts allies (D-054).
# Schema v3 (M3, all optional): contaminate, decontaminate (radiation 0..255 in the splash), bonus_vs_irradiated_percent
# (default 100), blackout_ticks.

[auth_small_arms]
versus = [100, 50, 15, 10, 5, 100, 100, 100]
splash = 0
hits_allies = false

[auth_ap]
versus = [25, 75, 100, 50, 40, 100, 100, 100]
splash = 0
hits_allies = false

[auth_he]
versus = [100, 80, 60, 70, 50, 100, 100, 100]
splash = 1
hits_allies = true

