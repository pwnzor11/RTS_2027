# M4-07 (design 08 §3, §4): warheads for the Seismic Mortar, Quick-Set Foam, the Authority superweapon and the Ash Sower.
# Numbers marked ASSUMED (M4-07) copy the nearest existing warhead; hits_burrowed, bonus_vs_entrance_percent, foam_ticks and
# garrison_damage_percent are design 08 §6 keys. M4-05 implements them.

[auth_seismic]   # Seismic Mortar: hits Burrowed units, 2x vs entrances (D-074), passes part of the hit to garrisons (Q-M4-f)
versus = [100, 80, 60, 70, 50, 100, 100, 100]  # ASSUMED (M4-07): copy of auth_he
splash = 1  # ASSUMED (M4-07)
