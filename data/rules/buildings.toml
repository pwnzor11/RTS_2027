# Authority M2 roster: placeholder balance (tune in M2-14).
# Keys: footprint_w, footprint_h (cells, 1..6), max_health, armor, sight, primary_weapon ("" = none), cost,
# power (positive = produces, negative = drains), prerequisites, provides.
# Optional: category ("structure"|"defence"), produces (""|"infantry"|"vehicle"|"aircraft"), build_time, storage,
# refinery, dock [x,y], exit [x,y], free_unit (vehicle id), wall, needs_power.
#
# Starting base and prerequisite chain. Every structure's chain starts at auth_conyard. Prerequisites name a type
# id or a provides name; auth_conyard provides "auth_conyard", so "owns a building that provides auth_conyard" is
# the root test for the Structure and Defence queues. The conyard itself produces nothing (produces = "").
#
#   auth_conyard -> auth_power -> auth_refinery -> auth_factory   (vehicles, incl. auth_scraper)
#                                    |        \-> auth_silo
#                                    \-> auth_barracks -> auth_turret   (infantry too)
#   auth_conyard -> auth_wall
#
# Balance (tuned in M2-14; docs/balance/m2_balance.md has the reasons):
#   id              footprint  hp    cost  power  notes
#   auth_conyard    3x3        1000  0     0      starting building; provides auth_conyard
#   auth_power      2x2        400   300   +100   root: auth_conyard
#   auth_refinery   3x3        700   2000  -40    dock [1,3]; ships with one free auth_scraper; storage 1000
#   auth_barracks   2x2        450   300   -20    produces infantry; root: auth_power
#   auth_factory    3x3        800   2000  -30    produces vehicle; root: auth_refinery
#   auth_silo       2x2        250   150   -10    storage 1500; root: auth_refinery
#   auth_wall       1x1        200   50    0      defence, wall (1x1 only, no production); root: auth_conyard
#   auth_turret     1x1        400   400   -20    defence, needs_power; root: auth_barracks
# Power balance for a full base: +100 - 40 - 20 - 30 - 10 = 0 (turret adds -20 only when it is built).

[auth_conyard]
footprint_w = 3
footprint_h = 3
max_health = 1000
armor = "structure"
sight = 6
primary_weapon = ""
cost = 0
power = 0
prerequisites = []
provides = ["auth_conyard"]
category = "structure"
produces = ""
buildable = false

[auth_power]
footprint_w = 2
footprint_h = 2
max_health = 400
armor = "structure"
sight = 3
