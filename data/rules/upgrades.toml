# Upgrades (M3, design 05 §4). Keys: faction (default from the id prefix), cost, build_time (optional, 0 = from cost),
# prerequisites (type ids, provides names or upgrade ids), effect (string key the sim interprets).
# The index of an upgrade (entries sorted by id) is its bit in the player's upgrade mask; at most 64 upgrades.
# auth_grouting is researched at auth_engineering (M3-07; a building with researches = true).

[auth_grouting]
tier = 2
faction = "authority"
cost = 1500
build_time = 0
prerequisites = []
effect = "grouting"

# M4-07 (design 08 §4): tiered upgrades. Each applies its [[effect]] entries in techs.toml in list order (M4-04 RulesDeriver).
# Costs: T1 800, T2 1500 (copy of auth_grouting), T3 2500, all ASSUMED (M4-07). Tier provides are appended automatically (tier sugar).

