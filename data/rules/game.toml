# Real game rules (M2). [economy] was tuned in M2-14: see docs/balance/m2_balance.md.
[game]
tick_rate = 20
default_map_width = 32
default_map_height = 32

[economy]
starting_cash = 5000
credits_ashfall = 150
credits_pitchblende = 300
harvest_ticks_per_unit = 4
unload_ticks_per_unit = 2
regrowth_interval_ticks = 1200
sell_refund_permille = 500
repair_cost_permille = 500
repair_hp_per_tick = 2
build_radius = 2
max_queue = 5
build_ticks_per_100_credits = 40
low_power_slowdown_permille = [1500, 2500, 4000]

# M3 (design 05). All tables and keys optional; the values below are the design starting values (tune in M3-14).
[tunnels]
transit_ticks = 100  # (tune) M3-14: 40 -> 100
network_cap_points = 10
points_s = 1
points_m = 3
dive_ticks = 20
telegraph_ticks = 60
entrance_telegraph_ticks = 100
emerging_health_permille = 250
surfacing_ring = 1

[radiation]
decay_ticks = 40
damage_interval_ticks = 20
damage_threshold = 32
damage_permille = 100
no_build_threshold = 64

[stealth]
delay_ticks = 60

# Skirmish start kit per faction: conyard (building id) and units (vehicle/infantry ids). Validated only when a player of
# that faction is set up.
[faction.authority]
conyard = "auth_conyard"
units = []

# Directorate kit (M3-07). The design fixes only the conyard; the four conscripts are ASSUMED (M3-07), confirm in M3-14.
[faction.directorate]
conyard = "dir_shaft"
units = ["dir_conscript", "dir_conscript", "dir_conscript", "dir_conscript"]  # ASSUMED (M3-07)
