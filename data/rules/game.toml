# Real game rules (M2). [economy] was tuned in M2-14: see docs/balance/m2_balance.md.
[game]
tick_rate = 20
default_map_width = 32
default_map_height = 32

[economy]
starting_cash = 5000
credits_ashfall = 150
credits_pitchblende = 300
harvest_ticks_per_unit = 4
unload_ticks_per_unit = 2
regrowth_interval_ticks = 1200
sell_refund_permille = 500
repair_cost_permille = 500
repair_hp_per_tick = 2
build_radius = 2
max_queue = 5
build_ticks_per_100_credits = 40
low_power_slowdown_permille = [1500, 2500, 4000]
wreck_ticks = 1200  # M6-08: turns wrecks on for every faction (design 10 §3.2)

# M3 (design 05). All tables and keys optional; the values below are the design starting values (tune in M3-14).
[tunnels]
transit_ticks = 100  # (tune) M3-14: 40 -> 100
network_cap_points = 10
points_s = 1
points_m = 3
dive_ticks = 20
telegraph_ticks = 60
entrance_telegraph_ticks = 100
emerging_health_permille = 250
surfacing_ring = 1

[radiation]
decay_ticks = 40
damage_interval_ticks = 20
damage_threshold = 32
damage_permille = 100
no_build_threshold = 64

[stealth]
delay_ticks = 60

# Generic veterancy (VET-4, D-127, design 14). Three ranks for every faction: Veteran / Elite / Hero. Kill value = victim cost x permille;
# thresholds, bonuses and heal are the design 14 §2 table, all (tune) until the balance run (VET-7). A rank-3 unit is worth about two
# of its type. Armour is a damage-taken factor, so a promotion never needs a health fix-up. `veteran = false` on a type opts it out.
[veterancy]
enabled = true
thresholds = [600, 1600, 3200]  # (tune) kill value for Veteran / Elite / Hero
kill_permille_unit = 1000  # (tune)
kill_permille_building = 500  # (tune)
damage_permille = [1100, 1200, 1300]  # (tune) damage dealt
taken_permille = [950, 900, 800]  # (tune) damage taken, lower is tougher
reload_permille = [950, 900, 800]  # (tune) reload time, lower is faster
speed_permille = [1000, 1050, 1100]  # (tune)
heal_interval_ticks = 20  # (tune) 1 s
heal_permille = [0, 0, 10]  # (tune) Hero recovers 1 % of max health per interval when quiet
heal_quiet_ticks = 100  # (tune) 5 s without firing or being hit

# Supply cap (SUP-1, D-125, design 13). On by default in skirmish per D-129; the D-133 hold was lifted in session 10 (SUP-5 AI fix). Unit supply = band of its cost (cost <= band1_max: first
# value, <= band2_max: second, above: third) unless the type sets `supply`; the cap is the sum of supply_provided over completed,
# unpacked, alive own buildings, at most `ceiling`. stock_intervals is parsed for the Expedition store only (no behaviour yet).
[supply]
enabled = true
ceiling = 200  # (tune)
band1_max = 400  # (tune)
band2_max = 900  # (tune)
band_values = [1, 2, 3]  # (tune)
stock_intervals = 3  # (tune)

# Skirmish start kit per faction: conyard (building id) and units (vehicle/infantry ids). Validated only when a player of
# that faction is set up.
[faction.authority]
conyard = "auth_conyard"
units = []
tier2 = "auth_tier2"
tier3 = "auth_tier3"

# Directorate kit (M3-07). The design fixes only the conyard; the four conscripts are ASSUMED (M3-07), confirm in M3-14.
[faction.directorate]
conyard = "dir_shaft"
units = ["dir_conscript", "dir_conscript", "dir_conscript", "dir_conscript"]  # ASSUMED (M3-07)
tier2 = "dir_tier2"  # M4-07 (design 08 §4)
tier3 = "dir_tier3"  # M4-07 (design 08 §4)

# Left Behind kit (M6-08, D-102): no construction-yard building. A packed Mother Rig vehicle (unpacks into lb_mother_rig) + 2 Scavengers
# + 1 Gleaner. conyard = "" is legal only because the units list holds a packed rig. T2 gate lb_lookout, T3 gate lb_rotor_pad.
[faction.left_behind]
conyard = ""
units = ["lb_mother_rig_packed", "lb_scavenger", "lb_scavenger", "lb_gleaner"]
tier2 = "lb_tier2"
tier3 = "lb_tier3"
