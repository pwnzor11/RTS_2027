# Credits roll (M10-20). Mirrors docs/CREDITS.md in short form: every row of its tables must be covered by an entry's `match` text, and every entry must
# match at least one row (tests/Game.Tests/M10/CreditsTests.cs checks both). Add a row to CREDITS.md, add or widen an entry here.
title = "RTS_2027"
subtitle = "Credits"
closing = "Thank you for playing."

[[section]]
heading = "Libraries"

[[section.entry]]
name = "MonoGame"
credit = "Game framework. Microsoft Public License."
match = ["MonoGame.Framework.DesktopGL"]

[[section.entry]]
name = "SDL 2"
credit = "Window and input back end. zlib licence."
match = ["MonoGame.Library.SDL"]

[[section.entry]]
name = "OpenAL Soft"
credit = "Audio back end. LGPL 2, dynamically loaded."
match = ["MonoGame.Library.OpenAL"]

[[section.entry]]
name = "NVorbis"
credit = "Ogg Vorbis decoding. MIT licence."
match = ["NVorbis"]

[[section.entry]]
name = "Tomlyn"
credit = "TOML parsing of rules and maps. BSD-2-Clause."
match = ["Tomlyn"]

[[section.entry]]
name = "MoonSharp"
credit = "Embedded Lua for campaign mission scripts. BSD-3-Clause."
match = ["MoonSharp"]

[[section.entry]]
name = "System.IO.Hashing"
credit = "State and rules hashes. MIT licence."
match = ["System.IO.Hashing"]

[[section.entry]]
name = ".NET"
credit = "The runtime. MIT licence."
match = [".NET runtime"]

[[section]]
heading = "Fonts, effects and props"

[[section.entry]]
name = "Noto Sans"
credit = "Google and the Noto project. SIL Open Font Licence 1.1."
match = ["Noto Sans Regular and Bold"]

[[section.entry]]
name = "Skorpio"
credit = "Explosion and lightning frames from the sci-fi-effects pack."
match = ["sci-fi-effects"]

[[section.entry]]
name = "Sharm (Lanea Zimmerman)"
credit = "LPC flames, used for burning buildings."
match = ["LPC flames"]

[[section.entry]]
name = "Liberated Pixel Cup artists"
credit = "Lanea Zimmerman (Sharm), Casper Nilsson, Daniel Eddeland, Johann Charlot, Skyler Robert Colladay, Stephen Challener (Redshrike), Charles Sanchez (CharlesGabriel), Manuel Riecke (MrBeast) and Daniel Armstrong (HughSpectrum). Boulders, rubble and stumps."
match = ["lpc_props.png"]

[[section.entry]]
name = "Kenney"
credit = "Smoke and dust puff shapes. CC0, www.kenney.nl."
match = ["Puff sheets", "Particle shapes from Kenney"]

[[section.entry]]
name = "0 A.D. contributors"
credit = "Wildfire Games and the 0 A.D. team. Map prop renders, CC BY-SA 3.0."
match = ["0 A.D. prop renders"]

[[section.entry]]
name = "This project"
credit = "The original procedural effect sheets."
match = ["Pre-import procedural effect sheets"]

[[section]]
heading = "Sound and music"

[[section.entry]]
name = "Sound effects"
credit = "Generated by a tool in this project and with Stable Audio Open 1.0 (Stability AI Community License)."
match = ["Generated sound effects", "Real sound recordings"]

[[section.entry]]
name = "Radio voices"
credit = "Generated with Kokoro-82M (Apache-2.0)."
match = ["Radio voice lines"]

[[section.entry]]
name = "Music"
credit = "Generated with ACE-Step 1.5. Released CC0."
match = ["Music tracks"]

[[section]]
heading = "Artwork"

[[section.entry]]
name = "Act stills"
credit = "Rendered in Blender from scenes written in code with Claude. Style chosen by the project owner."
match = ["data/images/stills"]
