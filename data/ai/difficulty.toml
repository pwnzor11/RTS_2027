# AI difficulty tiers: capability profiles (design 02 section 7).
# M3-11: tiers 2-5 are built on the Recruit framework; every capability is gated on a flag below, never on the tier number.
#
# Integers only (flags are 0/1). Keys per tier table:
#   tier                    1..5 (must match the table id: recruit 1, regular 2, veteran 3, elite 4, commissar 5)
#   decision_interval_ticks ticks between AI decisions (smaller = faster reactions)
#   command_delay_ticks     ticks between an order being issued and executed (>= 1)
#   scout_info_age_ticks    how long a last-seen enemy position (harvester, building) is trusted
#   attack_threshold        army size at which the AI starts a wave
#   focus_fire              0/1: explicit Attack orders on the weakest enemy in range (skirmisher AI)
#   retreat_health_pct      0..100: units below this health percent leave the fight and guard home (0 = never); a wave whose
#                           total health falls below (this + 20) percent of its launch health is called off
#   expansion_tick          0 = never; from this tick the build order adds a second refinery and one more harvester is wanted
#   superweapons            0/1: build a superweapon structure (if the faction has one) and fire it when ready
#   multi_front             0/1: two squads stage on opposite flanks and assault together (needs two_pronged)
#   build_repertoire        structure ids in build order (recruit: its fixed order; empty = the faction's built-in order)
# Capability flags added in M3-11 (all optional, default 0; harvester_target default 1):
#   repair                  0/1: repair damaged structures
#   replace_harvesters      0/1: rebuild a harvester that was lost (up to harvester_target, +1 after expansion_tick)
#   respond_to_attacks      0/1: idle units rush to a structure that is under attack
#   scatter                 0/1: units standing in splash fire move out of it (Scatter command)
#   enemy_aware_mix         0/1: unit choice follows damage-per-credit against the armour classes the enemy has been seen with
#   two_pronged             0/1: a large wave splits into two squads that hit two different targets
#   counter_defences        0/1: with several enemy defences known, favour long-range units
#   air                     0/1: build the faction's air tech and aircraft (Directorate only; Authority has none)
#   scouting                0/1: one cheap unit scouts the likely enemy positions
#   harass                  0/1: a small party raids remembered enemy harvesters and power structures
#   use_upgrades            0/1: build the research structure and research upgrades
#   adapt_build             0/1: extra production structures when cash piles up; defences when the enemy is armour-heavy
#   harvester_target        1..6: harvesters wanted alive (used with replace_harvesters)
# M4-12 (no new keys: the loader lives in src/Data; new behaviour rides on existing flags, constants marked (tune) in src/AI/Recruit):
#   respond_to_attacks      also: defend a harvester under fire, fill the faction's Blockhouse / Redoubt and empty neutral ruins
#                           near the base with idle infantry, grow the unit bags with tier-2/3 types, reinforce a wave on the
#                           attack, end a stalled assault, stop stuck units
#   replace_harvesters      also: the no-income rescue (cancel / sell spare structures for a harvester) and broke mode
#   use_upgrades            also: tier climbing (tier-2 gate at 3 min, tier-3 gate at 7 min or a 12-unit army) and, at the
#                           matching tier, the Airfield / Mooring (air) and the superweapon (superweapons)

[recruit]
tier = 1
decision_interval_ticks = 60
command_delay_ticks = 2
scout_info_age_ticks = 300
attack_threshold = 10
focus_fire = 0
retreat_health_pct = 0
expansion_tick = 0
superweapons = 0
multi_front = 0
build_repertoire = ["auth_power", "auth_refinery", "auth_barracks", "auth_power", "auth_factory", "auth_silo", "auth_turret"]

