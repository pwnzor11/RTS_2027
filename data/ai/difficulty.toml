# AI difficulty tiers: capability profiles (design 02 section 7).
# M3-11: tiers 2-5 are built on the Recruit framework; every capability is gated on a flag below, never on the tier number.
#
# Integers only (flags are 0/1). Keys per tier table:
#   tier                    1..5 (must match the table id: recruit 1, regular 2, veteran 3, elite 4, commissar 5)
#   decision_interval_ticks ticks between AI decisions (smaller = faster reactions)
#   command_delay_ticks     ticks between an order being issued and executed (>= 1)
#   scout_info_age_ticks    how long a last-seen enemy position (harvester, building) is trusted
#   attack_threshold        army size at which the AI starts a wave
#   focus_fire              0/1: explicit Attack orders on the weakest enemy in range (skirmisher AI)
#   retreat_health_pct      0..100: units below this health percent leave the fight and guard home (0 = never); a wave whose
#                           total health falls below (this + 20) percent of its launch health is called off
#   expansion_tick          0 = never; from this tick the build order adds a second refinery and one more harvester is wanted
#   superweapons            0/1: build a superweapon structure (if the faction has one) and fire it when ready
#   multi_front             0/1: two squads stage on opposite flanks and assault together (needs two_pronged)
#   build_repertoire        structure ids in build order (recruit: its fixed order; empty = the faction's built-in order)
# Capability flags added in M3-11 (all optional, default 0; harvester_target default 1):
#   repair                  0/1: repair damaged structures
#   replace_harvesters      0/1: rebuild a harvester that was lost (up to harvester_target, +1 after expansion_tick)
#   respond_to_attacks      0/1: idle units rush to a structure that is under attack
#   scatter                 0/1: units standing in splash fire move out of it (Scatter command)
#   enemy_aware_mix         0/1: unit choice follows damage-per-credit against the armour classes the enemy has been seen with
#   two_pronged             0/1: a large wave splits into two squads that hit two different targets
#   counter_defences        0/1: with several enemy defences known, favour long-range units
#   air                     0/1: build the faction's air tech and aircraft (Directorate only; Authority has none)
#   scouting                0/1: one cheap unit scouts the likely enemy positions
#   harass                  0/1: a small party raids remembered enemy harvesters and power structures
#   use_upgrades            0/1: build the research structure and research upgrades
#   adapt_build             0/1: extra production structures when cash piles up; defences when the enemy is armour-heavy
#   harvester_target        1..6: harvesters wanted alive (used with replace_harvesters)
# M4-12 (no new keys: the loader lives in src/Data; new behaviour rides on existing flags, constants marked (tune) in src/AI/Recruit):
#   respond_to_attacks      also: defend a harvester under fire, fill the faction's Blockhouse / Redoubt and empty neutral ruins
#                           near the base with idle infantry, grow the unit bags with tier-2/3 types, reinforce a wave on the
#                           attack, end a stalled assault, stop stuck units
#   replace_harvesters      also: the no-income rescue (cancel / sell spare structures for a harvester) and broke mode
#   use_upgrades            also: tier climbing (tier-2 gate at 3 min, tier-3 gate at 7 min or a 12-unit army) and, at the
#                           matching tier, the Airfield / Mooring (air) and the superweapon (superweapons)
# S15 lbknob (D-186, per faction AND tier, optional): tables [faction.<id>.tier1] .. [faction.<id>.tier5] override some numbers of that one tier for
#   that one faction (the other factions and tiers keep the shared tier table; keys not set keep the shared value). Allowed keys: respond_to_attacks (0/1, s38), attack_threshold, attack_ratio_pct, expansion_tick,
#   harvester_target, retreat_health_pct, retreat_ratio_pct, unit_reserve, army_cap. Behaviour only, never unit/building/weapon/cost numbers.
#   army_cap       0..1000: army units alive (home, on a wave, detached; harvesters excluded) at which unit production pauses until losses make room
#                  (0 = no cap; also allowed in a tier table). The one lever found that cut Left Behind tier 3 without touching its tier 5.
#   army_cap_until_tick  0..: the cap holds only before this tick (0 = the whole game)
#   unit_reserve   0..100000: credits a unit purchase leaves in hand (0 = none; also allowed in a tier table)
# D-167 (per faction, optional): tables [faction.authority], [faction.directorate], [faction.left_behind], [faction.expedition]
#   harass_min_army         1..1000: army size before the raiding party (flag harass) is formed; missing key or table = 30.
#                           Directorate 14, the others 30 (s13 ladder: Authority raiders pulled out of a small army cost it the wave)
# S29 (BAL-S29, per faction, optional; none is set in the faction tables below, so every default applies):
#   army_before_tech        1..1000: army size before the research structure and the tier-2 gate are added; default 30 (TierPlanner.ArmyBeforeTech).
#                           Left Behind ignores it (it never waits for an army).
#   army_before_adapt       0..1000: army size before AdaptBuild adds production / defence; default 30 (TierPlanner.ArmyBeforeAdapt).
#   adapt_cash              0..100000: funds (cash + stored) at which AdaptBuild adds a barracks / factory; default 1500 (TierPlanner.FloatingCash).
#   adapt_max_production    2..6: the most barracks and the most factories AdaptBuild grows to; default 2.
#   tier2_gate_tick         0..100000: tick from which the tier-2 gate is added; default 3600 (TierPlanner.Tier2GateTick).
#   adapt_build             0/1: force the adapt_build flag for this faction at every tier (only the commissar table sets it); missing = the tier's own flag.
#   siege_commit_ratio      0..10000 (s29, percent, missing key = 0 = off): a wave is never called off by the health retreat (or the predicted-loss
#                           retreat) while our army value is at least this percent of the enemy army seen lately plus the known defences of its target.
#                           Why: the Expedition retreat floor (40 percent health, +10 margin) walked every wave home at half health, 8 waves in a row, v a Directorate
#                           base worth 1-3k credits of defences and no army, while it held 12k of army.
#   aa_needs_air            0/1 (s29, missing key = 0 = off): 1 = the faction builds no vehicle whose gun only hits aircraft (the Expedition Sparker) until an
#                           enemy aircraft has been seen. Why: a third of the Expedition tier-2 bag is Sparkers (600 each); traced games held 6-15 of them
#                           (up to 9000 credits, over half the army value) against a Directorate with no aircraft, and none of it can shoot a base.
#   aa_cap_before_air       0..100 (s30, missing key = 0 = off): softer aa_needs_air: until an enemy aircraft is seen, at most this many anti-air-only
#                           vehicles may be alive or queued (aa_needs_air = 1 wins when both are set).
#   retreat_floor_pct       0..100 (s30, missing key = the built-in floor: 40 for the Expedition (ExpeditionTactics.RetreatPct), none for the others):
#                           waves of this faction are called home below this health percent (a minimum: a tier's higher retreat_health_pct still applies).
#   mopup_hunt              0/1 (s30, missing key = 0 = off): 1 = the faction's mop-up (tier 2+, never in missions) also hunts a relocating base such as the
#                           Left Behind Mother Rig that packs, drives off and unpacks elsewhere. While on: packed rigs and other deployable vehicles do not count
#                           as an enemy army for the "beaten" test, the last cell where one was seen is chased for a while, blocks where enemy structures stood
#                           are swept first, stale blocks are revisited after 3000 instead of 6000 ticks, and sweep parties are 3 units instead of 6.
# s39 (M13-38, per faction, optional): production growth for a side that banks money. s39 trace of the Directorate at +50 % (--handicap-a 150): the funds never sat at the
#   storage cap (the 4 989 peak is the starting cash) nor at the supply cap; the side banked 2-3k for 1 000+ ticks while one Bore and one Muster Hatch worked, because
#   AdaptBuild waits for an army of 30 and stops at 2 of each. Off by default (no game changes); 2000 / 3 took the +50 % side from 15-13-4 to 24-6-2 (16 seeds, Rust Belt).
#   adapt_rich_cash  0..100000 (default 0 = off): funds (cash + stored) at which AdaptBuild skips army_before_adapt and grows production (factory first) to adapt_rich_max.
#                    s39: only for a side whose handicap is above 100 (an income edge, e.g. the Super hard (LLM) preset), so normal games never change.
#   adapt_rich_max   2..6 (default 3): the most barracks and factories a rich side grows to (never below adapt_max_production).
# s39 (M13-37, per faction, optional; only the Directorate has Bores): the Directorate Bore levers of DirectorateTactics; missing keys = the former constants.
#   bore_max        0..20 (default 5): Bores bought over a whole game; 0 = the AI never buys one.
#   bore_army       0..1000 (default 4): army size before the first Bore.
#   bore_gap_ticks  0..100000 (default 1500): ticks between Bore purchases.
#   bore_dig_short  0..60 (default 15): cells short of the enemy target at which the enemy-side Hatch is dug.
#   bore_sites      0..2 (default 0): 0 = alternate enemy side and ore field, 1 = ore field only, 2 = enemy side only.
#   bore_min_cash   0..100000 (default 200): funds needed beyond the Bore's cost before one is bought.

[faction.authority]
harass_min_army = 30

# M4-16 s38: the Authority ladder was inverted (2 v 1 30 %, 5 v 3 40 %, 128 games): respond_to_attacks (garrison and Blockhouse, wave regroup, mop-up, bag growth ...)
# made every higher Authority tier play worse than the fixed tier-1 order; with the flag off at tier 2 it wins 76-84 % of the same cell.
[faction.authority.tier2]
respond_to_attacks = 0  # (tune) s38

[faction.authority.tier3]
respond_to_attacks = 0  # (tune) s38
army_cap = 40  # (tune) s38 D-288: with respond_to_attacks off the tier-3 Authority overran LB/Exp on Rust Belt (75 %); 128 games per row, docs/balance/s38_balance.md

[faction.authority.tier4]
respond_to_attacks = 0  # (tune) s38

[faction.authority.tier5]
respond_to_attacks = 0  # (tune) s38

[faction.directorate]
harass_min_army = 14
bore_max = 0  # (tune) s39 M13-37 D-290: the AI bought ~3 Bores a game and lost them; no Hatch placement paid (docs/balance/s39_balance.md), assumed — confirm
adapt_rich_cash = 2000  # (tune) s39 M13-38: with an income edge the Directorate grows a 3rd factory/barracks instead of banking (Dir t5 +50 % v t5: 46 -> 75 %, 32 games)

# D-265 (s31): the Directorate tier-3 AI waits for a bigger edge before it attacks (shared veteran table: 110). On 128 games with destructible props
# every Directorate row moved toward 50 % (Dir v Exp 70 -> 62, Auth v Dir 45 -> 48, Exp v Dir glass 58 -> 54, Dir v LB 47 -> 48); docs/balance/s31_balance.md.
[faction.directorate.tier3]
attack_ratio_pct = 140  # (tune) s31

[faction.left_behind]
harass_min_army = 30

# D-186: Left Behind tier 3 out-produced every tier-3 opponent (68 % decisive v Authority 3, 87 % v Directorate 3 at 32 games, 96x96) while tier 5 was
# fine; its cheap Buggy / Hook Runner bags snowball to 40+ units by t3000. A cap on the early swarm (see docs/balance/s15_lbknob.md) brings tier 3 down.
[faction.left_behind.tier3]
army_cap = 20  # (tune) s15
army_cap_until_tick = 3600  # (tune) s15: the early snowball only; a longer cap cost it the Expedition games. s23 (D-230): 3600 -> 4800 (LB v Exp 48-9 on the s22 laptop series; 6000 overshot)

[faction.expedition]
harass_min_army = 30
aa_cap_before_air = 10   # (tune) s32 D-266: at most 10 anti-air-only vehicles until an enemy aircraft is seen (Dir v Exp rust 62 -> 58 %, docs/balance/s32_balance.md)

