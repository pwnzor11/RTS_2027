# AI difficulty tiers: capability profiles (design 02 section 7).
# placeholder values -- tune in M2/M3
#
# Integers only. Keys per tier table:
#   tier                    1..5 (must match the table id: recruit 1, regular 2, veteran 3, elite 4, commissar 5)
#   decision_interval_ticks ticks between AI decisions (smaller = faster reactions)
#   command_delay_ticks     ticks between an order being issued and executed (>= 1)
#   scout_info_age_ticks    how long a last-seen enemy position is trusted
#   attack_threshold        army size at which the skirmisher starts attacking
#   focus_fire              0/1: explicit Attack orders on the weakest enemy in range
#   retreat_health_pct      0..100: reserved (not used by the M1 skirmisher)
#   expansion_tick          0 = never; reserved until the economy lands
#   superweapons            0/1: reserved
#   multi_front             0/1: reserved
#   build_repertoire        structure ids in build order (recruit: its fixed order; empty = the AI's built-in order)

[recruit]
tier = 1
decision_interval_ticks = 60
command_delay_ticks = 2
scout_info_age_ticks = 300
attack_threshold = 10
focus_fire = 0
retreat_health_pct = 0
