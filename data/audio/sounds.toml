# Weapon id -> event, for callers that know the weapon (a snapshot diff cannot see it, so the AudioDirector plays
# the class events fire_bullet / fire_shell instead). Unlisted weapons use the class by projectile speed.
[weapon]
auth_rifle = "fire_bullet"
auth_jeep_mg = "fire_bullet"
auth_rocket = "fire_missile"
auth_tank_cannon = "fire_shell"
auth_turret_gun = "fire_shell"
