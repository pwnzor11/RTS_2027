# Game events -> sounds (D-080). Files are relative to this folder. Generated sounds come from tools/audio/presets.toml and tools/audio/sfx/.
# Variants: an event with several sounds picks one at random (game-side RNG, not the sim).
# max_voices: at most this many copies of ONE sound play at once; extra plays are dropped.
# cooldown_ms: least time between two plays of one event. positional: volume and pan follow the camera.
#
# QUALIFIED EVENTS (S22, M10-10). An event name may carry a class and a faction: [event.unit_died.infantry.directorate].
# The game looks an event up most-specific-first and plays the first entry that exists:
#     <event>.<class>.<faction>  ->  <event>.<class>  ->  <event>.<faction>  ->  <event>
# and when none of them exists, the event's stand-in: unit_died -> explosion_small, building_destroyed -> explosion_large,
# water_impact -> explosion_small (explosion_large for a splash of 3+ cells, class "large"), ship_horn -> unit_ready (class ship). The stand-in is
# looked up the same way. Events with no stand-in (sonar, air_flyby, air_hover, rig_deploy, rig_pack) are silent without an entry. So the game plays
# exactly what it played before when a qualified entry (or its sound file) is missing. A cooldown runs per entry (per resolved name).
#   class   : unit_died / unit_ready: infantry | vehicle | ship | air.   fire_*: the weapon class of the [weapon] table below
#             (small_arms sniper mg flame spray | cannon rail energy mortar howitzer flak naval_shell naval_heavy depth_charge | rocket salvo sam harpoon).
#             explosion_large.bomb: a bomber's blast.   water_impact.large: a splash of 3+ cells.
#   faction : authority | directorate | left_behind | expedition   (building_placed, construction_complete, building_destroyed, unit_ready,
#             unit_died, fire_*, air_*, rig_*).
# Raised by: building_placed (own building placed), construction_complete (own queue item ready), building_destroyed (a building removed with its
# health gone), unit_died (a unit removed with its health gone; class and faction of the unit), unit_ready (an own new unit), ship_horn (an own new
# ship, instead of unit_ready), fire_bullet / fire_shell / fire_missile (a shot; the weapon class qualifies it), explosion_*, water_impact (a blast on
# an empty water cell), sonar (an enemy submarine comes into view), air_flyby (a moving aircraft of speed 40+, every 6 s each), air_hover (aircraft of
# speed 20..39, every 4 s each), rig_deploy / rig_pack (a rig unfolds / packs; the building/vehicle swap is not reported as placed / ready / sold).
#
# AMBIENCE (S22): [ambience.<key>] sound = "<sound id>", volume = 0..1 plays a stereo loop while a game is on screen. Keys: glass_coast, rust_belt,
# ash_plains, mountains (the map's theater) and open_sea (when over 60% of the cells around the camera are water). Cross-faded, off in menus,
# scaled by the Ambience volume setting. No entry = that biome is silent.
#
# The sections below the "sfx-generated" marker at the end of the file are written by tools/audio/sfx/make_sfx.py --pick; do not edit them by hand.
version = 1

[settings]
default_max_voices = 4
hearing_radius_cells = 48   # a positional sound is silent beyond this distance from the camera centre
pan_radius_cells = 24       # horizontal offset that pans fully left or right

