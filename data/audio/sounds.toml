# Game events -> sounds (D-080). Files are relative to this folder. Generated sounds come from tools/audio/presets.toml.
# Variants: an event with several sounds picks one at random (game-side RNG, not the sim).
# max_voices: at most this many copies of ONE sound play at once; extra plays are dropped.
# cooldown_ms: least time between two plays of one event. positional: volume and pan follow the camera.
# ASSUMED (M3-09): all numbers here are first guesses made without listening.
version = 1

[settings]
default_max_voices = 4
hearing_radius_cells = 48   # a positional sound is silent beyond this distance from the camera centre
pan_radius_cells = 24       # horizontal offset that pans fully left or right

[sound.blackout_hum]
file = "sfx/blackout_hum.wav"
