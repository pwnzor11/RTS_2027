# Weapon id -> sound class, for EVERY weapon in data/rules/weapons.toml (a test fails when a weapon has no class). S22 (M10-10).
# The class picks the event family (small_arms, sniper, mg, flame, spray -> fire_bullet; cannon, rail, energy, mortar, howitzer, flak, naval_shell,
# naval_heavy, depth_charge -> fire_shell; rocket, salvo, sam, harpoon -> fire_missile) and is the first qualifier of the lookup, for example
# fire_shell.cannon.authority -> fire_shell.cannon -> fire_shell.authority -> fire_shell. 'silent' (death and self-destruct weapons) and 'bomb'
# (the sound is the detonation, explosion_large.bomb) make no shot sound. Projectile weapons are named by the projectile's weapon; instant weapons by the
# nearest armed enemy in range of the hit (a guess when several shoot at once). The faction qualifier comes from the weapon id prefix.
[weapon]
# Authority
auth_rifle = "small_arms"
auth_rocket = "rocket"
auth_jeep_mg = "mg"
auth_tank_cannon = "cannon"
auth_turret_gun = "cannon"
auth_decon_spray = "spray"
auth_marksman_rifle = "sniper"
auth_seismic_mortar_gun = "mortar"
auth_foam_spray = "spray"
auth_flak_gun = "flak"
auth_interceptor_gun = "rocket"
auth_howitzer_gun = "howitzer"
auth_bomb = "bomb"
# Directorate
dir_rifle = "small_arms"
