# LLM provider defaults for the AI commander (M5-08). Read by src/Llm/ProviderDefaults.cs.
# A missing file or key falls back to the same values built into the game.
# The API key is never stored here; it lives in the encrypted %APPDATA%/RTS_2027/llm.key.

[anthropic]
base_url = "https://api.anthropic.com"
# Current models as of 2026-11-04 (Q-40, platform.claude.com/docs/en/models/overview).
default_model = "claude-haiku-5-5"   # fast and cheap: the default
strong_model = "claude-sonnet-5-5"   # stronger, slower, costs more: the "Use stronger model" toggle
# output_config.effort sent with every request; "low" keeps the model's thinking short so decisions come back quickly.
# Set to "" when pointing default_model at an older model that rejects the field (e.g. the 4.5 generation).
effort = "low"

[openai]
base_url = "https://api.openai.com"
# No default model: the player types the model name their server offers (OpenAI, LM Studio, Ollama, llama.cpp ...).
default_model = ""
