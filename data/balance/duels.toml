# s41 (M13-43): unit-v-unit balance fixtures, checked by tests/Tools.Tests/DuelFixtureTests.
# Each [[duel]] plays two equal-cost armies (budget credits each, split by weight) on a flat map with no AI: they attack-move at each other and
# the score is the share of its army value A keeps minus B's share, permille (-1000..1000), averaged over 3 layouts x both sides
# (Tools ai duels --a <a> --b <b> --budget <budget> --seeds 3). A fixture states design intent; a change that breaks one needs a decision.
# Side specs: id[:weight][+id[:weight]...]. The Expedition's grown v tier-1 lists are left out: the result flips with army size (s41: +381 at 8 000,
# -448 at 12 000), so it is not a stable intent.

[[duel]]
a = "auth_rocketeer"
b = "auth_tank"
budget = 8000
min = 300
max = 1000
why = "anti-tank infantry beats tanks for the same money"

[[duel]]
a = "auth_tank"
b = "auth_rifleman"
budget = 8000
min = 200
max = 1000
why = "tanks beat rifle infantry"

