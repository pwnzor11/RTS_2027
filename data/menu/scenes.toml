# Menu background scenes (M3-16). The main menu and every menu screen draw these, one after another, cross-fading.
#
# Canvas: every position is on a 1920 x 1080 canvas, scaled to cover the window. y grows downward.
# Colours: "#RRGGBB" or "#RRGGBBAA" (the last pair is opacity).
# Layers are drawn first to last (back to front). Kinds:
#   gradient   y0, y1, color (top), color2 (bottom)               sky, haze (give both colours an alpha for haze)
#   glow       x, y, radius, color, intensity, flicker, flicker_hz, additive
#   skyline    style = ruins | stacks | ridge | pylons, y (base line), min_height, max_height, period (repeat width),
#              seed, color (top), color2 (bottom), rim (lit edge), lit (windows / furnaces)
#   ground     y, roughness, color (top), color2 (bottom)
#   sprites    [[scene.layer.item]] tables: sprite (id under data/sprites), x, y, scale, facing (0 north, 64 east, 192 west),
#              state, anchor ("origin" = ground point for units, "bottom" = middle of the bottom edge for buildings),
#              house (0..7 paint colour), speed (px/s sideways), loop_width, ticks_per_second (animation), alpha, shadow,
#              shade (0 = as drawn, 1 = black), fallback_w / fallback_h / fallback_color / fallback_shape ("block" | "blimp")
#              for art that does not exist yet
#   particles  particle = ash | ember | snow, count, vel_x, vel_y, size_min, size_max, sway, color, rim (ember core), seed
# Every layer has parallax: 0 = fixed sky, 1 = the ground plane, above 1 = close foreground.
# A sprite id that is not in data/sprites yet is not an error: its place is kept and a dark silhouette is drawn instead
# (this is how the Directorate scene works until that art lands). New scene = new [[scene]] block; nothing else to change.
#
# Scene fields: id, caption (bottom-left of the menu), duration (seconds on screen, 20-30 is calm), drift_x / drift_y /
# drift_period (the slow camera sway), grade (a colour wash over the whole scene; the last two hex digits are the strength,
# e.g. "#1E2E4838"; a plain #RRGGBB gets a light default strength).

[menu]
fade_seconds = 3.0



