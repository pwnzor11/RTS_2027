# Glass Coast terrain palette, SHIPPED look (D-181) = S15 variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py (do not hand-edit; variants/c is the same data). Look files: variants/classic = pre-S15 look, variants/a|b|c; RTS_TERRAIN_LOOK=classic|a|b|c selects one, unset = this file.
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#C9C0A5"
base = "#E4DABC"
light = "#FFF9D6"

[land.road]
# Roads: lighter than the ground around them.
dark = "#5C6A6A"
base = "#687878"
light = "#778989"

[land.rough]
# Rubble and scrub.
dark = "#BC9F6D"
base = "#D6B57C"
light = "#F4CE8D"

[land.ash]
# Ash ground: its own hue.
dark = "#604842"
base = "#6D524B"
light = "#7C5D55"

[land.water]
# Deep water: clearly blue.
dark = "#15365C"
base = "#183D69"
light = "#1B4678"

[land.rock]
# Rock outcrops.
dark = "#304640"
base = "#374F49"
light = "#3F5A53"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#121B1A"
base = "#151F1D"
light = "#182321"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#3B8F8E"
base = "#43A3A1"
light = "#4CBAB8"

[overlay.ashfall]
speck = "#6A645A"
max_coverage_permille = 300

[overlay.pitchblende]
chunk = "#7C9A3C"
glint = "#E6FFE6"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#E0EEE8"
road_edge_texels = 1
shore = "#F0F8F6"
shore_texels = 3
cliff_top = "#AAD7CD"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#803C26"
light = "#BE623C"
shade = "#462018"
rim = "#281410"

[field.pitchblende]
body = "#28966E"
light = "#6EDCAA"
shade = "#105042"
rim = "#0A2822"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF8C32"
pitchblende = "#3CEB6E"

[decor]
# M12 decor (shipped look only; the classic, a and b files have none). Decals are derived from an integer hash of (map hash, cell) and baked to a
# second texture; sizes are sixteenths of a cell. Sprites: the kind per land class and the permille of a cluster's cells that carry one.
# ASSUMED (M12): all decor colours and chances are proposals for the owner to tune.
rock = "glasscrest"
rock_permille = 300
rough = "rubble"
rough_permille = 150

[[decor.decal]]
name = "sand ripple"
shape = "ripple"
on = ["clear", "rough"]
permille = 30
colour = "#A69064"
alpha = 200
size_min = 20
size_max = 32

[[decor.decal]]
name = "glint patch"
shape = "soft"
on = ["clear"]
permille = 10
colour = "#FFFADC"
alpha = 100
size_min = 16
size_max = 26

[[decor.decal]]
name = "shells and bone"
shape = "dots"
on = ["clear", "rough", "coast"]
permille = 16
colour = "#8C7054"
alpha = 230
size_min = 20
size_max = 30

[[decor.decal]]
name = "dune shadow"
shape = "soft"
on = ["clear"]
permille = 14
colour = "#968060"
alpha = 120
size_min = 24
size_max = 40

[[decor.decal]]
name = "salt crust"
shape = "soft"
on = ["clear", "rough"]
permille = 12
colour = "#FAFAF4"
alpha = 120
size_min = 24
size_max = 36

[[decor.decal]]
name = "glass bowl"
shape = "ring"
on = ["clear"]
permille = 5
colour = "#3C968C"
alpha = 170
size_min = 18
size_max = 26

[[decor.decal]]
name = "drowned stripe"
shape = "stripe"
on = ["shallow"]
permille = 26
colour = "#E8F0E8"
alpha = 160
size_min = 12
size_max = 18


[mood]
# D-184 pilot: a colour grade laid over the world view only (not the HUD) and the colour of vehicle dust. Glass Coast: bright and sunlit.
# strength 0..90 = how much of the tint is blended in (0 or no table = no grade, the look of today); RTS_MOOD=off switches it off for comparison.
# ASSUMED (D-184): every value here is a proposal for the owner. NOTE: tools/maps/make_s15_looks.py rewrites this file from variant C; re-add this table if it is run.
tint = "#FFF3C8"
strength = 22
dust = "#EFE2B4"
