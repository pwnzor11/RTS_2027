# Glass Coast terrain palette, S15 look variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=c (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#C9C0A5"
base = "#E4DABC"
light = "#FFF9D6"

[land.road]
# Roads: lighter than the ground around them.
dark = "#5C6A6A"
base = "#687878"
light = "#778989"

[land.rough]
# Rubble and scrub.
dark = "#BC9F6D"
base = "#D6B57C"
light = "#F4CE8D"

[land.ash]
# Ash ground: its own hue.
dark = "#604842"
base = "#6D524B"
light = "#7C5D55"

[land.water]
# Deep water: clearly blue.
dark = "#15365C"
base = "#183D69"
light = "#1B4678"

[land.rock]
# Rock outcrops.
dark = "#304640"
base = "#374F49"
light = "#3F5A53"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#121B1A"
base = "#151F1D"
light = "#182321"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#3B8F8E"
base = "#43A3A1"
light = "#4CBAB8"

[overlay.ashfall]
speck = "#6A645A"
max_coverage_permille = 300

[overlay.pitchblende]
chunk = "#7C9A3C"
glint = "#E6FFE6"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#E0EEE8"
road_edge_texels = 1
shore = "#F0F8F6"
shore_texels = 3
cliff_top = "#AAD7CD"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#803C26"
light = "#BE623C"
shade = "#462018"
rim = "#281410"

[field.pitchblende]
body = "#28966E"
light = "#6EDCAA"
shade = "#105042"
rim = "#0A2822"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF8C32"
pitchblende = "#3CEB6E"

