# Ash Plains terrain palette, S15 look variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py. Pick it with RTS_TERRAIN_LOOK=c (see TerrainPalette.ActiveLook); this is also what data/theaters/ash_plains.toml ships (D-181).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#726E48"
base = "#827D52"
light = "#948E5D"

[land.road]
# Roads: lighter than the ground around them.
dark = "#A6A49B"
base = "#BDBAB0"
light = "#D7D4C9"

[land.rough]
# Rubble and scrub.
dark = "#463026"
base = "#4F372B"
light = "#5A3F31"

[land.ash]
# Ash ground: its own hue.
dark = "#8C8083"
base = "#9F9295"
light = "#B5A6AA"

[land.water]
# Deep water: clearly blue.
dark = "#2F4F76"
base = "#355A86"
light = "#3C6799"

[land.rock]
# Rock outcrops.
dark = "#414146"
base = "#4A4A50"
light = "#54545B"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1A1A1D"
base = "#1D1D21"
light = "#212126"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#357070"
base = "#3C7F7F"
light = "#449191"

[overlay.ashfall]
speck = "#2A2B2E"
max_coverage_permille = 550

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#ECFFD6"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#342E30"
road_edge_texels = 1
shore = "#CDE8F2"
shore_texels = 3
cliff_top = "#AAA0B4"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#8C3822"
light = "#E8783A"
shade = "#421C16"
rim = "#1C0E0E"

[field.pitchblende]
body = "#5AD696"
light = "#AAFAC8"
shade = "#1E785A"
rim = "#0A2C22"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF821E"
pitchblende = "#50F096"

[decor]
# M12 decor (shipped look only; the classic, a and b files have none). Decals are derived from an integer hash of (map hash, cell) and baked to a
# second texture; sizes are sixteenths of a cell. Sprites: the kind per land class and the permille of a cluster's cells that carry one.
# ASSUMED (M12): all decor colours and chances are proposals for the owner to tune.
rock = "boulder"
rock_permille = 280
rough = "rubble"
rough_permille = 200

[[decor.decal]]
name = "ash drift"
shape = "soft"
on = ["clear", "ash"]
permille = 34
colour = "#C4C0C4"
alpha = 120
size_min = 24
size_max = 40

[[decor.decal]]
name = "cracked earth"
shape = "crack"
on = ["clear", "ash"]
permille = 32
colour = "#2C221C"
alpha = 210
size_min = 14
size_max = 26

[[decor.decal]]
name = "crater"
shape = "ring"
on = ["clear", "ash", "rough"]
permille = 22
colour = "#2E2826"
alpha = 210
size_min = 18
size_max = 30

[[decor.decal]]
name = "burnt grass"
shape = "soft"
on = ["clear", "ash"]
permille = 22
colour = "#262016"
alpha = 150
size_min = 18
size_max = 30

[[decor.decal]]
name = "bones"
shape = "dots"
on = ["clear", "ash"]
permille = 10
colour = "#EAE6D8"
alpha = 245
size_min = 16
size_max = 24

