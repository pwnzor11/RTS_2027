# Rust Belt terrain palette, S15 look variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=c (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#7D7363"
base = "#8E8371"
light = "#A29581"

[land.road]
# Roads: lighter than the ground around them.
dark = "#A9A395"
base = "#C0B9A9"
light = "#DBD3C1"

[land.rough]
# Rubble and scrub.
dark = "#8B5C43"
base = "#9E684C"
light = "#B47757"

[land.ash]
# Ash ground: its own hue.
dark = "#3A3244"
base = "#42394D"
light = "#4B4158"

[land.water]
# Deep water: clearly blue.
dark = "#2D4E7A"
base = "#33598B"
light = "#3A659E"

[land.rock]
# Rock outcrops.
dark = "#3F4146"
base = "#484A50"
light = "#52545B"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1B1A17"
base = "#1F1D1A"
light = "#23211E"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#458E99"
base = "#4EA1AE"
light = "#59B8C6"

[overlay.ashfall]
speck = "#17171A"
max_coverage_permille = 450

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#F0FFC8"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#342E28"
road_edge_texels = 1
shore = "#CDE8F2"
shore_texels = 3
cliff_top = "#BEB4A0"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#B05C2C"
light = "#EC9648"
shade = "#68321C"
rim = "#1E120E"

[field.pitchblende]
body = "#6ED278"
light = "#B0FAAA"
shade = "#287850"
rim = "#0E281E"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF9628"
pitchblende = "#6EF078"

