# Mountains terrain palette, S15 look variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py. Pick it with RTS_TERRAIN_LOOK=c (see TerrainPalette.ActiveLook); this is also what data/theaters/mountains.toml ships (D-181).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#807564"
base = "#918572"
light = "#A59882"

[land.road]
# Roads: lighter than the ground around them.
dark = "#898275"
base = "#9C9485"
light = "#B2A998"

[land.rough]
# Rubble and scrub.
dark = "#3B342E"
base = "#433B34"
light = "#4C433B"

[land.ash]
# Ash ground: its own hue.
dark = "#9EA4AF"
base = "#B4BAC7"
light = "#CDD4E3"

[land.water]
# Deep water: clearly blue.
dark = "#2C4F76"
base = "#325A86"
light = "#396799"

[land.rock]
# Rock outcrops.
dark = "#44413C"
base = "#4D4A44"
light = "#58544E"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1C1916"
base = "#201C19"
light = "#24201C"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#3E6D7D"
base = "#467C8E"
light = "#508DA2"

[overlay.ashfall]
speck = "#3A3835"
max_coverage_permille = 350

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#F0FFC8"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#ECE0BE"
road_edge_texels = 1
shore = "#D2E8F4"
shore_texels = 3
cliff_top = "#C4BEB4"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#B05C2C"
light = "#EC9648"
shade = "#68321C"
rim = "#1E120E"

[field.pitchblende]
body = "#6ED278"
light = "#B0FAAA"
shade = "#287850"
rim = "#0E281E"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF9628"
pitchblende = "#6EF078"

[decor]
# M12 decor (shipped look only; the classic, a and b files have none). Decals are derived from an integer hash of (map hash, cell) and baked to a
# second texture; sizes are sixteenths of a cell. Sprites: the kind per land class and the permille of a cluster's cells that carry one.
# ASSUMED (M12): all decor colours and chances are proposals for the owner to tune.
rock = "boulder"
rock_permille = 360
rough = "rubble"
rough_permille = 150
bank = "iceslab"
bank_permille = 100

[[decor.decal]]
name = "scree"
shape = "dots"
on = ["rough", "clear"]
permille = 28
colour = "#524C44"
alpha = 230
size_min = 22
size_max = 32

[[decor.decal]]
name = "snow patch"
shape = "soft"
on = ["clear", "rough"]
permille = 24
colour = "#F0F4FA"
alpha = 180
size_min = 22
size_max = 36

[[decor.decal]]
name = "pebbles"
shape = "dots"
on = ["clear"]
permille = 16
colour = "#AEA89C"
alpha = 240
size_min = 16
size_max = 24

[[decor.decal]]
name = "frost crack"
shape = "crack"
on = ["clear"]
permille = 8
colour = "#BED4E8"
alpha = 190
size_min = 14
size_max = 22

[[decor.decal]]
name = "frozen pool"
shape = "blob"
on = ["clear"]
permille = 6
colour = "#96BEDA"
alpha = 190
size_min = 10
size_max = 16

