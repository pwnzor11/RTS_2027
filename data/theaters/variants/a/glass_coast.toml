# Glass Coast terrain palette, S15 look variant A 'Re-tune': palette only.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=a (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 8

[land.clear]
# Open ground.
dark = "#C9C0A5"
base = "#E4DABC"
light = "#FFF9D6"

[land.road]
# Roads: lighter than the ground around them.
dark = "#5C6A6A"
base = "#687878"
light = "#778989"

[land.rough]
# Rubble and scrub.
dark = "#BC9F6D"
base = "#D6B57C"
light = "#F4CE8D"

[land.ash]
# Ash ground: its own hue.
dark = "#604842"
base = "#6D524B"
light = "#7C5D55"

[land.water]
# Deep water: clearly blue.
dark = "#15365C"
base = "#183D69"
light = "#1B4678"

[land.rock]
# Rock outcrops.
dark = "#304640"
base = "#374F49"
light = "#3F5A53"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#121B1A"
base = "#151F1D"
light = "#182321"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#3B8F8E"
base = "#43A3A1"
light = "#4CBAB8"

[overlay.ashfall]
speck = "#6A645A"
max_coverage_permille = 300

[overlay.pitchblende]
chunk = "#7C9A3C"
glint = "#D7E26A"
max_coverage_permille = 600
glint_one_in = 7

