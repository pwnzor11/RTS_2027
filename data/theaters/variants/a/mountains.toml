# Mountains terrain palette, S15 look variant A 'Re-tune': palette only.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=a (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 8

[land.clear]
# Open ground.
dark = "#807564"
base = "#918572"
light = "#A59882"

[land.road]
# Roads: lighter than the ground around them.
dark = "#898275"
base = "#9C9485"
light = "#B2A998"

[land.rough]
# Rubble and scrub.
dark = "#3B342E"
base = "#433B34"
light = "#4C433B"

[land.ash]
# Ash ground: its own hue.
dark = "#9EA4AF"
base = "#B4BAC7"
light = "#CDD4E3"

[land.water]
# Deep water: clearly blue.
dark = "#2C4F76"
base = "#325A86"
light = "#396799"

[land.rock]
# Rock outcrops.
dark = "#44413C"
base = "#4D4A44"
light = "#58544E"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1C1916"
base = "#201C19"
light = "#24201C"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#3E6D7D"
base = "#467C8E"
light = "#508DA2"

[overlay.ashfall]
speck = "#3A3835"
max_coverage_permille = 350

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#D7E26A"
max_coverage_permille = 600
glint_one_in = 7

