# Rust Belt terrain palette, S15 look variant A 'Re-tune': palette only.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=a (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 8

[land.clear]
# Open ground.
dark = "#7D7363"
base = "#8E8371"
light = "#A29581"

[land.road]
# Roads: lighter than the ground around them.
dark = "#A9A395"
base = "#C0B9A9"
light = "#DBD3C1"

[land.rough]
# Rubble and scrub.
dark = "#8B5C43"
base = "#9E684C"
light = "#B47757"

[land.ash]
# Ash ground: its own hue.
dark = "#3A3244"
base = "#42394D"
light = "#4B4158"

[land.water]
# Deep water: clearly blue.
dark = "#1C4D8F"
base = "#2057A2"
light = "#2463B9"

[land.rock]
# Rock outcrops.
dark = "#3F4146"
base = "#484A50"
light = "#52545B"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1B1A17"
base = "#1F1D1A"
light = "#23211E"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#458E99"
base = "#4EA1AE"
light = "#59B8C6"

[overlay.ashfall]
speck = "#17171A"
max_coverage_permille = 450

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#D7E26A"
max_coverage_permille = 600
glint_one_in = 7

