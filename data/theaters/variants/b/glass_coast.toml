# Glass Coast terrain palette, S15 look variant B 'Edges': A plus road edge lines, shoreline, cliff lip and drop shadow, large-scale tone.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=b (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#B9B098"
base = "#D2C8AD"
light = "#EFE4C5"

[land.road]
# Roads: lighter than the ground around them.
dark = "#5C6A6A"
base = "#687878"
light = "#778989"

[land.rough]
# Rubble and scrub.
dark = "#978057"
base = "#AC9163"
light = "#C4A571"

[land.ash]
# Ash ground: its own hue.
dark = "#604842"
base = "#6D524B"
light = "#7C5D55"

[land.water]
# Deep water: clearly blue.
dark = "#0F3468"
base = "#113B76"
light = "#134387"

[land.rock]
# Rock outcrops.
dark = "#304640"
base = "#374F49"
light = "#3F5A53"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#121B1A"
base = "#151F1D"
light = "#182321"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#39B4AF"
base = "#41CDC7"
light = "#4AEAE3"

[overlay.ashfall]
speck = "#6A645A"
max_coverage_permille = 300

[overlay.pitchblende]
chunk = "#7C9A3C"
glint = "#D7E26A"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#E0EEE8"
road_edge_texels = 1
shore = "#F0F8F6"
shore_texels = 3
cliff_top = "#AAD7CD"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

