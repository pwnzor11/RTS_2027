# Ash Plains terrain palette, S15 look variant B 'Edges': A plus road edge lines, shoreline, cliff lip and drop shadow, large-scale tone.
# Generated by tools/maps/make_s15_looks.py. Not active by default: set RTS_TERRAIN_LOOK=b (see TerrainPalette.ActiveLook).
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#726E48"
base = "#827D52"
light = "#948E5D"

[land.road]
# Roads: lighter than the ground around them.
dark = "#A6A49B"
base = "#BDBAB0"
light = "#D7D4C9"

[land.rough]
# Rubble and scrub.
dark = "#463026"
base = "#4F372B"
light = "#5A3F31"

[land.ash]
# Ash ground: its own hue.
dark = "#8C8083"
base = "#9F9295"
light = "#B5A6AA"

[land.water]
# Deep water: clearly blue.
dark = "#2F4F76"
base = "#355A86"
light = "#3C6799"

[land.rock]
# Rock outcrops.
dark = "#414146"
base = "#4A4A50"
light = "#54545B"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1A1A1D"
base = "#1D1D21"
light = "#212126"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#357070"
base = "#3C7F7F"
light = "#449191"

[overlay.ashfall]
speck = "#2A2B2E"
max_coverage_permille = 550

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#D7E26A"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#342E30"
road_edge_texels = 1
shore = "#CDE8F2"
shore_texels = 3
cliff_top = "#AAA0B4"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

