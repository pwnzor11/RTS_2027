# Rust Belt terrain palette, SHIPPED look (D-181) = S15 variant C 'Edges + fields': B plus resource deposits (heaps/crystals with a rim) and minimap resource colours.
# Generated by tools/maps/make_s15_looks.py (do not hand-edit; variants/c is the same data). Look files: variants/classic = pre-S15 look, variants/a|b|c; RTS_TERRAIN_LOOK=classic|a|b|c selects one, unset = this file.
# ASSUMED (S15): every colour is a proposal for the owner to pick from.
format_version = 1
texel_cells = 16

[land.clear]
# Open ground.
dark = "#7D7363"
base = "#8E8371"
light = "#A29581"

[land.road]
# Roads: lighter than the ground around them.
dark = "#A9A395"
base = "#C0B9A9"
light = "#DBD3C1"

[land.rough]
# Rubble and scrub.
dark = "#8B5C43"
base = "#9E684C"
light = "#B47757"

[land.ash]
# Ash ground: its own hue.
dark = "#3A3244"
base = "#42394D"
light = "#4B4158"

[land.water]
# Deep water: clearly blue.
dark = "#2D4E7A"
base = "#33598B"
light = "#3A659E"

[land.rock]
# Rock outcrops.
dark = "#3F4146"
base = "#484A50"
light = "#52545B"

[land.cliff]
# Cliffs: dark face (B and C add a light lip).
dark = "#1B1A17"
base = "#1F1D1A"
light = "#23211E"

[land.shallow]
# Fords and lagoon: lighter blue-green than deep water.
dark = "#458E99"
base = "#4EA1AE"
light = "#59B8C6"

[overlay.ashfall]
speck = "#17171A"
max_coverage_permille = 450

[overlay.pitchblende]
chunk = "#8A9A3C"
glint = "#F0FFC8"
max_coverage_permille = 600
glint_one_in = 7

[style]
# Distances are in texels (16 per cell here).
# The sim's real density scale is 0..12 (EconomyState.MaxDensity); the old rules read it as 0..255, which is why fields looked faint.
density_full = 12
blotch_shift = 4
tone_amp = 7
tone_cells = 7
road_edge = "#342E28"
road_edge_texels = 1
shore = "#CDE8F2"
shore_texels = 3
cliff_top = "#BEB4A0"
cliff_top_texels = 1
cliff_shadow_permille = 500
cliff_shadow_texels = 4

[field]
# Resource cells as deposits: a darker bed, a rim where the field meets other ground, 1..4 heaps per cell (more and bigger when richer).
rim_texels = 1
bed_permille = 200
max_heaps = 4

[field.ashfall]
body = "#B05C2C"
light = "#EC9648"
shade = "#68321C"
rim = "#1E120E"

[field.pitchblende]
body = "#6ED278"
light = "#B0FAAA"
shade = "#287850"
rim = "#0E281E"

[minimap]
# Distinct resource colours on the minimap (brighter when richer).
ashfall = "#FF9628"
pitchblende = "#6EF078"

[decor]
# M12 decor (shipped look only; the classic, a and b files have none). Decals are derived from an integer hash of (map hash, cell) and baked to a
# second texture; sizes are sixteenths of a cell. Sprites: the kind per land class and the permille of a cluster's cells that carry one.
# ASSUMED (M12): all decor colours and chances are proposals for the owner to tune.
rock = "boulder"
rock_permille = 300
rough = "rubble"
rough_permille = 220
bank = "iceslab"
bank_permille = 120

[[decor.decal]]
name = "pothole"
shape = "blob"
on = ["road"]
permille = 22
colour = "#1E1C1A"
alpha = 190
size_min = 5
size_max = 9

[[decor.decal]]
name = "road crack"
shape = "crack"
on = ["road", "clear"]
permille = 24
colour = "#24201C"
alpha = 210
size_min = 14
size_max = 24

[[decor.decal]]
name = "oil spill"
shape = "soft"
on = ["road"]
permille = 12
colour = "#16182C"
alpha = 170
size_min = 12
size_max = 20

[[decor.decal]]
name = "manhole"
shape = "ring"
on = ["road"]
permille = 4
colour = "#46423C"
alpha = 255
size_min = 6
size_max = 7

[[decor.decal]]
name = "soot stain"
shape = "soft"
on = ["clear", "rough", "road"]
permille = 18
colour = "#100E0E"
alpha = 120
size_min = 20
size_max = 32

[[decor.decal]]
name = "snow patch"
shape = "soft"
on = ["clear", "ash", "rough"]
permille = 14
colour = "#ECF0F6"
alpha = 150
size_min = 18
size_max = 30

[[decor.decal]]
name = "small crater"
shape = "ring"
on = ["clear", "ash"]
permille = 8
colour = "#342C26"
alpha = 200
size_min = 18
size_max = 28

[[decor.decal]]
name = "frost crack"
shape = "crack"
on = ["water"]
permille = 30
colour = "#D6EAF8"
alpha = 170
size_min = 16
size_max = 28


[mood]
# D-184 pilot: a colour grade laid over the world view only (not the HUD) and the colour of vehicle dust. Rust Belt: warm, dusty orange.
# strength 0..90 = how much of the tint is blended in (0 or no table = no grade, the look of today); RTS_MOOD=off switches it off for comparison.
# ASSUMED (D-184): every value here is a proposal for the owner. NOTE: tools/maps/make_s15_looks.py rewrites this file from variant C; re-add this table if it is run.
tint = "#E39A4A"
strength = 28
dust = "#B98A5C"
