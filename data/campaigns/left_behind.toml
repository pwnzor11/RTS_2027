# Left Behind campaign (plan 2.2, 2.4, M8-07). Opens after act 2 of either original faction.
# lb_01..lb_04 exist (M8-10, M8-12); auth_02 / dir_02 are the act-2 missions of the other campaigns.
[campaign]
faction = "left_behind"
title_key = "campaign.left_behind.title"
ending = "left_behind_ending"
open_after = ["auth_02", "dir_02"]

[[missions]]
id = "lb_01"

# S48 (C-12, D-337): "Under One Banner" is play position 2 of the 12-mission plan. lb_06 (Salvage Rights) will join between lb_05 and lb_02;
# until it is built the list order is the play order, and lb_02 requires lb_05.
[[missions]]
id = "lb_05"
requires = ["lb_01"]

[[missions]]
id = "lb_02"
still = "still_left_behind_act2"
requires = ["lb_05"]

[[missions]]
id = "lb_03"
still = "still_left_behind_act3"
requires = ["lb_02"]

[[missions]]
id = "lb_04"
still = "still_left_behind_act4"
requires = ["lb_03"]
