# Left Behind campaign (plan 2.2, 2.4, M8-07). Opens after act 2 of either original faction.
# lb_01..lb_04 exist (M8-10, M8-12); auth_02 / dir_02 are the act-2 missions of the other campaigns.
[campaign]
faction = "left_behind"
title_key = "campaign.left_behind.title"
ending = "left_behind_ending"
open_after = ["auth_02", "dir_02"]

[[missions]]
id = "lb_01"

# S48 (C-12): "Under One Banner" is play position 2, "Salvage Rights" play position 3 (design 22 §3.3).
[[missions]]
id = "lb_05"
requires = ["lb_01"]

[[missions]]
id = "lb_06"
requires = ["lb_05"]

[[missions]]
id = "lb_02"
still = "still_left_behind_act2"
requires = ["lb_06"]

[[missions]]
id = "lb_03"
still = "still_left_behind_act3"
requires = ["lb_02"]

[[missions]]
id = "lb_04"
still = "still_left_behind_act4"
requires = ["lb_03"]
