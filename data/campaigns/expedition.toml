# Expedition campaign (plan 2.2, 2.4, M8-07). Opens after act 3 of either original faction.
# exp_01..exp_04 exist (M8-10, M8-12); auth_03 / dir_03 are the act-3 missions of the other campaigns.
[campaign]
faction = "expedition"
title_key = "campaign.expedition.title"
open_after = ["auth_03", "dir_03"]
ending = "expedition_ending"

[[missions]]
id = "exp_01"

[[missions]]
id = "exp_02"
still = "still_expedition_act2"
requires = ["exp_01"]

[[missions]]
id = "exp_03"
still = "still_expedition_act3"
requires = ["exp_02"]

[[missions]]
id = "exp_04"
still = "still_expedition_act4"
requires = ["exp_03"]
