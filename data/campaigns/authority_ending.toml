[text]
"ending.authority.01" = "The Sunrise Device was destroyed in its chamber, and the Directorate's holy morning never came. Administrator Pell would not call it a victory. He filed it as a closed ledger, under the heading Maintenance, and went back to the drainage budget. The grain moved over the junction all that winter."
"ending.authority.02" = "Chief Surveyor Fenn finished her map of the Glass Coast, every launch site and every buried depot, and nobody has walked into one blind since. Brigadier Wrenfield read the old evacuation lists aloud at the Reconstruction Board, all four thousand names. She has stopped keeping her own list a secret. The convoys went to the coast. They did not come back with everyone."
"ending.authority.03" = "Lieutenant Dray walked unarmed into Shaft Four behind the decon crews and carried out the first people to see daylight in thirty years. The Voice was still reading numbers for a population that was no longer there. What the Commissar did when the device went dark, no teletype in the Authority will say. The Annex is failing, and the Authority has begun to send water down."
"ending.authority.04" = "It was close, and the Authority knew it. The labour year was extended by a second year, then a third, and the Charter clause that would dissolve the Authority when its work is done has not been read aloud since. In the dune sea the caravans still keep their own ledger, and the Authority still owes them an answer. Far offshore, the fleet waits for a letter nobody has written."
