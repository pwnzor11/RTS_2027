# Authority campaign (plan 3.5, M8-02 sample). Missions in play order; the Authority is open from the start (plan 2.4).
[campaign]
faction = "authority"
title_key = "campaign.authority.title"
ending = "authority_ending"

[[missions]]
id = "auth_01"

# S48 (C-12): "Hatch Country" is play position 2. auth_06 (The Mill Town) joins later between auth_05 and auth_02 and will then require auth_05
# (auth_02 will require auth_06 instead).
[[missions]]
id = "auth_05"
requires = ["auth_01"]

[[missions]]
id = "auth_02"
still = "still_authority_act2"
requires = ["auth_05"]

# S47 pilot (D-333, D-337): "The Defector" is play position 5 of the 12-mission plan; with only five Authority missions built it sits between
# auth_02 and auth_03 (the list order is the play order). auth_08 will require it later.
[[missions]]
id = "auth_07"
requires = ["auth_02"]

[[missions]]
id = "auth_03"
still = "still_authority_act3"
requires = ["auth_07"]

[[missions]]
id = "auth_04"
still = "still_authority_act4"
requires = ["auth_03"]
