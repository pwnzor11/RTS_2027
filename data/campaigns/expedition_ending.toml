[text]
"ending.expedition.01" = "The dredge works on the ash field ran for three seasons. The Second Relief Fleet loaded its holds, and the Concordat's reactors burned a little longer. Commissioner Strand wrote her telex herself. She never mentioned the papers in her desk, and the fleet never asked."
"ending.expedition.02" = "Fleet Admiral Aldersey brought home most of the ships he took out, and said so at every harbour. In his safe, beside the log of the first relief fleet, he kept a new page: the name of every hull that did not come back. He did not show it to anyone."
"ending.expedition.03" = "Dr. Roque stayed on the coast. He talked to the valves of the Dredge Works until the day they failed, and apologised to them when they did. Air Marshal Kell flew the last of her jets off the carrier and into the dunes, where there was nothing left to rearm them."
"ending.expedition.04" = "The Directorate redoubt was a crater by the autumn. The Voice went quiet, the Shaft never reopened, and the Authority's towns on the coast road saw the white pennant and did not close their doors. Nobody in the fleet called it a conquest."
"ending.expedition.05" = "Across the water the council of ministries went on quarrelling, and the telex stopped answering. The fleet looks at the old continent now and sees a coast, a harbour and a field of ash. RETURN WITH THE TIDE."
