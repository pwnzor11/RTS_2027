name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RTS_2027.slnx

      - name: Build
        run: dotnet build RTS_2027.slnx -c Release --no-restore

      - name: Test
        # The runner is slow while the AI and Sim suites run side by side; give each test host longer to start.
        env:
          VSTEST_CONNECTION_TIMEOUT: "600"
        run: dotnet test RTS_2027.slnx -c Release --no-build --logger trx

      - name: Validate data
        run: dotnet run --project src/Tools -c Release --no-build -- validate

      - name: Headless battle sandbox (end to end)
        run: dotnet run --project src/Game -c Release --no-build -- --headless-check 1200

      - name: Headless skirmish (economy, production, Recruit AI)
        run: dotnet run --project src/Game -c Release --no-build -- --skirmish-check 6000

      - name: Headless campaign mission (Lua host, auth_01)
        run: dotnet run --project src/Game -c Release --no-build -- --mission-check auth_01 6000

      - name: Verify the sandbox replay
        run: dotnet run --project src/Tools -c Release --no-build -- replay verify replays/sandbox_last.rpl --map data/maps/test_32.map.toml

      - name: Headless match and replay verify
        run: |
          dotnet run --project src/Tools -c Release --no-build -- match --ticks 1500 --record match.rpl | Tee-Object -FilePath match_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/Tools -c Release --no-build -- replay verify match.rpl

      - name: AI tier matrix (summary)
        run: |
          dotnet run --project src/Tools -c Release --no-build -- ai matrix --ai skirmisher --tiers 1-5 --seeds 2 --ticks 3000 --out ai_matrix.md
          Get-Content ai_matrix.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Match throughput (summary)
        if: always()
        run: |
          "### Match throughput" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path match_output.txt) { Select-String -Path match_output.txt -Pattern 'ticks/s' | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY } else { "match did not run" | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 3
          if-no-files-found: warn

  publish-game:
    name: Publish Windows game
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 30
    permissions:
      contents: write   # S23: the nightly pre-release
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Game -c Release -r win-x64 --self-contained -o publish/Game

      - name: Smoke test from an empty folder
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force publish/Game $smoke
          $exe = Join-Path $smoke 'Game.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--headless-check', '200' -WorkingDirectory $smoke -Wait -PassThru -NoNewWindow
          Write-Host "Smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Published game failed the headless smoke test (exit $($p.ExitCode))." }

      - name: Zip game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/out | Out-Null
          Compress-Archive -Path publish/Game/* -DestinationPath "publish/out/RTS_2027-win-x64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DSourceDir=$PWD\publish\Game" installer\rts_2027.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (exit $LASTEXITCODE)." }

      # S23: no game artifacts (they filled the Actions storage quota). A push to main replaces the rolling "nightly" pre-release
      # instead; release assets do not count against artifact storage and need no sign-in to download. Pull requests upload nothing.
      # Versioned releases still come from release.yml (v* tags).
      - name: Update the nightly pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @((Get-ChildItem publish/out/*.zip).FullName) + @((Get-ChildItem publish/installer/*.exe).FullName)
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = "Rolling build of main at ${{ github.sha }} ($stamp UTC). Not a versioned release: it is replaced on every push to main."
          gh release view nightly --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete nightly --repo ${{ github.repository }} --yes --cleanup-tag }
          gh release create nightly --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease --title "RTS_2027 nightly" --notes $notes $files
          if ($LASTEXITCODE -ne 0) { throw "Could not create the nightly release (exit $LASTEXITCODE)." }
