name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, test and validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RTS_2027.slnx

      - name: Build
        run: dotnet build RTS_2027.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RTS_2027.slnx -c Release --no-build --logger trx

      - name: Validate data
        run: dotnet run --project src/Tools -c Release --no-build -- validate

      - name: Headless battle sandbox (end to end)
        run: dotnet run --project src/Game -c Release --no-build -- --headless-check 1200

      - name: Verify the sandbox replay
        run: dotnet run --project src/Tools -c Release --no-build -- replay verify replays/sandbox_last.rpl --map data/maps/test_32.map.toml

      - name: Headless match and replay verify
        run: |
          dotnet run --project src/Tools -c Release --no-build -- match --ticks 1500 --record match.rpl | Tee-Object -FilePath match_output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/Tools -c Release --no-build -- replay verify match.rpl

      - name: AI tier matrix (summary)
        run: |
          dotnet run --project src/Tools -c Release --no-build -- ai matrix --ai skirmisher --tiers 1-5 --seeds 2 --ticks 3000 --out ai_matrix.md
          Get-Content ai_matrix.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Match throughput (summary)
        if: always()
        run: |
          "### Match throughput" | Add-Content $env:GITHUB_STEP_SUMMARY
          Select-String -Path match_output.txt -Pattern 'ticks/s' | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  publish-game:
    name: Publish Windows game
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Game -c Release -r win-x64 --self-contained -o publish/Game

      - name: Smoke test from an empty folder
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force publish/Game $smoke
          $exe = Join-Path $smoke 'Game.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--headless-check', '200' -WorkingDirectory $smoke -Wait -PassThru -NoNewWindow
          Write-Host "Smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Published game failed the headless smoke test (exit $($p.ExitCode))." }

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: RTS_2027-win-x64-${{ github.sha }}
          path: publish/Game
