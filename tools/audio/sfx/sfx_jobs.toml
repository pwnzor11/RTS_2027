# SFX job list for Stable Audio Open 1.0 (M10-10). One [job.<id>] per sound file; read by tools/audio/sfx/make_sfx.py.
# Output: tools/audio/sfx/out/<id>/take<N>.wav (git-ignored); `--pick` copies the chosen take to data/audio/sfx/<id>.wav
# and updates data/audio/sounds.toml (only for files that exist, so the game and SoundBankTests keep loading).
#
# Job keys (all optional except prompt; a job inherits [defaults], then its [category.<name>] block):
#   prompt        what the sound IS, physically and concretely (no brand, game or film names; English)
#   negative      negative prompt (default below); negative_extra is appended to it
#   seconds       generation window in seconds (the model is told this length; the file is trimmed to the sound, never longer)
#   takes         how many alternatives to generate (default 3)
#   channels      1 = mono downmix, 2 = keep stereo
#   rate          output sample rate (default 22050; one-shots mono, ambience stereo; S22 storage decision, the WAVs go through Git LFS)
#   peak_db       peak ceiling in dBFS; rms_db optional loudness target (RMS of the trimmed sound, capped by the peak ceiling)
#   trim_db       leading/trailing silence threshold in dBFS below the peak; fade_in_ms, fade_out_ms; trim=false keeps length
#   loop          true = make a seamless loop by cross-fading the tail into the head over loop_xfade seconds (no trim, no fades)
#   cfg           classifier-free guidance scale (default 7.0)
#   events        sounds.toml event keys the sound plays for. A plain key that already has an [event.x] (fire_bullet, explosion_small ...) gets the sound as
#                 one more random variant. A qualified key (S22) such as building_placed.authority, unit_died.infantry.directorate or fire_shell.cannon.authority
#                 becomes its own [event.<key>] section; the game looks keys up most specific first (class.faction, class, faction, plain; see the top of sounds.toml)
#                 and falls back to the plain event, so the game runs with any subset of the files.
#   ambience      a biome key (glass_coast rust_belt ash_plains mountains open_sea): the file becomes the looping [ambience.<key>] sound
#   mix_into      events it can ALSO be mixed into as an extra random variant (only with `--pick --mix`; no job uses it since the S22 code reads faction keys)
#   planned       informational note (only for a sound nothing plays yet)
#   repoint       an existing [sound.<id>] whose file is switched to this one when picked (menu sounds have no variants; their volume stays as tuned in sounds.toml)
#   volume, max_voices   written to the [sound.<id>] entry
# Faction voices: Authority = 1960s mechanical (steel, relays, bells, diesel); Directorate = industrial and radioactive (pneumatic,
# concrete, furnace, hum, detector clicks); Left Behind = scrap and rough (rusty tin, improvised, rattly); Expedition = naval and
# electronic (sonar, hydraulics, radio, clean synthetic blips).

[defaults]
takes = 3
channels = 1
rate = 22050   # S22 decision A: one-shots 22.05 kHz mono 16-bit (about 44 KB per second); the model renders 44.1 kHz and the tool resamples
seconds = 2.0
peak_db = -1.5
trim = true
trim_db = 45
fade_in_ms = 2
fade_out_ms = 60
cfg = 7.0
volume = 1.0
negative = "music, melody, singing, voice, speech, talking, whispering, crowd, laughter, drum loop, rhythm, beat, reverb wash, background noise, hiss, distortion, low quality"

# Defaults for the [event.<key>] sections that --pick creates for keys with no plain [event.x] in sounds.toml (qualified keys copy volume,
# positional and cooldown_ms from their plain event when it exists, so fire_shell.cannon.authority takes them from fire_shell).
[event_defaults.unit_died]
volume = 0.9
positional = true
cooldown_ms = 60

[event_defaults.building_destroyed]
volume = 1.0
positional = true
cooldown_ms = 150

[event_defaults.water_impact]
volume = 0.9
positional = true
cooldown_ms = 100

[event_defaults.sonar]
volume = 0.8
positional = true
cooldown_ms = 4000

[event_defaults.ship_horn]
volume = 0.9
positional = false
cooldown_ms = 2500

[event_defaults.air_flyby]
volume = 0.7
positional = true
cooldown_ms = 1500

[event_defaults.air_hover]
volume = 0.5
positional = true
cooldown_ms = 800

[event_defaults.rig_deploy]
volume = 1.0
positional = true
cooldown_ms = 1000

[event_defaults.rig_pack]
volume = 1.0
positional = true
cooldown_ms = 1000

[event_defaults.ambience]
volume = 0.5   # the quiet level of every [ambience.<key>] entry


[category.weapons]
label = "Weapons: small arms, cannons, missiles, special"
seconds = 2.0
negative_extra = "explosion, impact, long echo"

[category.explosions]
label = "Explosions and blasts"
seconds = 5.0
peak_db = -1.0
fade_out_ms = 250
negative_extra = "gunshot, rocket launch"

[category.buildings]
label = "Buildings: place, complete, destroyed (per faction)"
seconds = 3.0
fade_out_ms = 120

[category.deaths]
label = "Unit deaths (per faction, infantry and vehicle)"
seconds = 3.0
fade_out_ms = 150

[category.production]
label = "Production ready (per faction)"
seconds = 2.5
fade_out_ms = 120

[category.special]
label = "Naval, air, tunnel and rig events"
seconds = 4.0
fade_out_ms = 200

[category.alerts]
label = "Economy and alert events"
seconds = 3.0
fade_out_ms = 150

[category.ui]
label = "Menu and interface"
seconds = 1.0
peak_db = -3.0
fade_out_ms = 30
volume = 1.0

[category.ambience]
label = "Ambient biome loops (stereo, seamless)"
seconds = 24.0
channels = 2
loop = true
loop_xfade = 2.0
rate = 22050   # stereo loop, about 88 KB per second: 22 s is 1.9 MB. Use 32000 here for a crisper loop (2.8 MB) if you can hear the difference
trim = false
peak_db = -3.0
rms_db = -26
takes = 2
negative_extra = "sudden loud events, thunder crack, footsteps, distinct beats"

# =====================================================================================================================
# WEAPONS. The shot raises fire_bullet / fire_shell / fire_missile qualified by the weapon class of the [weapon] table of sounds.toml and by the
# faction of the weapon id: fire_shell.cannon.authority -> fire_shell.cannon -> fire_shell.authority -> fire_shell. Classes: small_arms sniper mg flame spray |
# cannon rail energy mortar howitzer flak naval_shell naval_heavy depth_charge | rocket salvo sam harpoon. Flak, bomb and silent (death) weapons have no job:
# flak uses fire_shell, bombs sound as explosion_large.bomb, death weapons as the explosion.
# =====================================================================================================================

